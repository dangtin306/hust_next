openapi: 3.0.3
info:
  title: Media Tech AI API Documentation
  version: 1.0.0
  description: |
    - Đây là tài liệu API AI của Media Tech.
    - Các API được xây dựng theo chuẩn OpenAPI, dùng để mô tả route, request, response và kết nối đến các module AI bên trong.
    - Theo mô hình OpenAI:
      - Responses API nhận input và tạo output cho từng request.
      - Conversations API lưu và truy xuất conversation state cùng các item qua nhiều lần gọi.
    - API URL test hiện tại: http://test.hust.media:8006. URL này có thể thay đổi nếu domain gặp lỗi.
    - Sau này Docker sẽ chạy trên máy anh Thành, nên cấu hình được giữ đơn giản để dễ triển khai.
    - Responses xử lý lượt gọi AI, còn Conversations giữ ngữ cảnh bền vững và liên kết bằng conversation_id.
    - Trang Home chỉ giới thiệu tổng quan và không chứa endpoint API.
    - Chọn **Laravel** để xem tài liệu tích hợp các service từ Laravel đến OpenClaw Gateway.
    - Chọn **OpenClaw** để xem các endpoint và service do OpenClaw Gateway cung cấp.
servers:
  - url: http://127.0.0.1:8006
    description: Configured OpenClaw Codex gateway
paths: {}
