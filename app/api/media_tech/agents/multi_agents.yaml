  /multi/agents/{agent}/mcp:
    post:
      tags:
      - MCP
      operationId: knowledgeMcp
      summary: MCP tri thức Media Tech (chỉ đọc)
      description: 'MCP Streamable HTTP, không giữ trạng thái. Gửi JSON-RPC 2.0 bằng POST: initialize, tools/list, tools/call.


        Bắt buộc header `Authorization: Bearer <token>`. Thiếu hoặc sai token trả 401. Server chưa đặt MT_MCP_TOKEN trả 503. GET và DELETE trả 405 kèm Allow: POST.


        {agent} là mã agent; mọi agent đọc cùng một bộ tri thức.'
      parameters:
      - name: agent
        in: path
        required: true
        description: Mã agent (chữ, số, gạch ngang, gạch dưới; tối đa 64 ký tự). Hiện chỉ dùng để ghi log.
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          example: test
      - name: Authorization
        in: header
        required: true
        description: Token MCP Media Tech, theo dạng Bearer <token>. Mặc định là token hiện tại.
        schema:
          type: string
          default: 'Bearer media_tech'
          example: 'Bearer media_tech'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              jsonrpc: '2.0'
              id: 1
              method: tools/list
              params: {}
      responses:
        '200':
          description: 'Phản hồi JSON-RPC (SSE event: message)'
        '401':
