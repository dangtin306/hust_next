components:
  schemas:
    ManageError:
      type: object
      required:
      - success
      - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: CHAT_BOT_MANAGE_UNAUTHORIZED
            message:
              type: string
              example: A valid bearer token is required.
    ManageValidationError:
      type: object
      required:
      - message
      - errors
      properties:
        message:
          type: string
          example: The status field is required.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            status:
            - The status field is required.
    WorkspaceRoutingUpdateResult:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
  securitySchemes:
    MCPBearer:
      type: http
      scheme: bearer
      description: 'Token MCP Media Tech (biến MT_MCP_TOKEN trên server). Authorization: Bearer <token>.'
    QwenBearer:
      type: http
      scheme: bearer
      description: 'Khóa truy cập Qwen relay do quản trị viên cấp (Authorization: Bearer <khóa>).'
