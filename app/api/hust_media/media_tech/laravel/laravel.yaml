          description: Danh sách phòng.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'
    post:
      operationId: createLaravelChatBotRoom
      tags: [Chat Bot]
      summary: Tạo hoặc liên kết phòng chat
      description: |
        `upstream_conversation_id` có thể bỏ qua; khi bỏ qua Laravel sẽ yêu cầu
        OpenClaw tạo conversation. Lần đầu tạo session, response trả
        `data.chat_bot_session`; lưu token này để gửi trong JSON body ở các request sau.
        Nếu conversation đã liên kết với user khác, trả HTTP 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_bot_session:
                  type: string
                  description: Token session hiện có; bỏ qua khi tạo session lần đầu.
                title:
                  type: string
                  maxLength: 255
                  example: Cuộc trò chuyện mới
                model:
                  type: string
                  maxLength: 128
                  example: gpt-5.6-luna
                agent:
                  type: string
                  maxLength: 100
                  example: chat_bot
                upstream_conversation_id:
                  type: string
                  maxLength: 255
                  example: conversation-id
            example:
              title: Cuộc trò chuyện mới
              model: model-name
              agent: chat_bot
              upstream_conversation_id: conversation-id
      responses:
        '200':
          description: Phòng đã được liên kết.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '201':
          description: Đã tạo phòng mới.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      room_id:
                        type: integer
                        example: 123
                      upstream_conversation_id:
                        type: string
                        example: conversation-id
                      title:
                        type: string
                        example: Cuộc trò chuyện mới
                      model:
                        type: string
                        example: model-name
                      agent:
                        type: string
                        example: chat_bot
                      status:
                        type: integer
                        example: 1
                      created_at:
                        type: string
                        format: date-time
                        example: "2026-10-01T10:00:00Z"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2026-10-01T10:00:00Z"
                      chat_bot_session:
                        type: string
                        description: Token thô chỉ trả khi tạo session lần đầu.
                        example: raw-session-token
        '409':
          description: Conversation đã liên kết với user khác.
        '503':
          description: Không tạo được phòng, thường do cần gọi OpenClaw.
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'
        '500':
          $ref: '#/components/responses/ChatBotError'

  /api/chat/bot/rooms/list:
    post:
      operationId: listLaravelChatBotRooms
      tags: [Chat Bot]
      summary: Lấy danh sách phòng chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_bot_session]
              properties:
                chat_bot_session:
                  type: string
                  example: raw-session-token
                page:
                  type: integer
                  minimum: 1
                  default: 1
                per_page:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 30
            example:
              chat_bot_session: raw-session-token
              page: 1
              per_page: 30
      responses:
        '200':
          description: Danh sách phòng và phân trang.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 30
                      total:
                        type: integer
                        example: 42
                      last_page:
                        type: integer
                        example: 2
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'

  /api/chat/bot/rooms/{roomId}/messages/list:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
        example: 123
    post:
      operationId: listLaravelChatBotRoomMessages
      tags: [Chat Bot]
      summary: Lấy lịch sử tin nhắn
      description: Gửi `before_id` bằng `next_before_id` của response trước để lấy trang cũ hơn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_bot_session]
              properties:
                chat_bot_session:
                  type: string
                  example: raw-session-token
                before_id:
                  type: integer
                  example: 456
                per_page:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 50
            examples:
              latest:
                summary: Lịch sử mới nhất
                value:
                  chat_bot_session: raw-session-token
                  per_page: 50
              olderPage:
                summary: Trang cũ hơn
                value:
                  chat_bot_session: raw-session-token
                  before_id: 456
                  per_page: 50
      responses:
        '200':
          description: Lịch sử tin nhắn và thông tin phân trang.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 456
                        role:
                          type: string
                          example: user
                        content:
                          type: string
                          example: Xin chào
                        service_id:
                          type: string
                          nullable: true
                        model:
                          type: string
                          example: model-name
                        created_at:
                          type: string
                          format: date-time
                        usage:
                          type: object
                          additionalProperties: true
                        upstream:
                          type: object
                          additionalProperties: true
                  pagination:
                    type: object
                    properties:
                      per_page:
                        type: integer
                        example: 50
                      has_more:
                        type: boolean
                        example: true
                      next_before_id:
                        type: integer
                        example: 456
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '404':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'

  /api/chat/bot/rooms/{roomId}/messages:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
        example: 123
    get:
      operationId: getLaravelChatBotRoomMessages
      tags: [Chat Bot]
      summary: Lấy lịch sử tin nhắn (GET cũ)
      description: GET route vẫn tồn tại nhưng client nên dùng POST `/messages/list`, vì GET body không được hỗ trợ ổn định.
      parameters:
        - name: before_id
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_bot_session]
              properties:
                chat_bot_session:
                  type: string
                  example: raw-session-token
      responses:
        '200':
          description: Lịch sử tin nhắn.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '404':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'
    post:
      operationId: saveLaravelChatBotTurn
      tags: [Chat Bot]
      summary: Lưu một lượt chat
      description: |
        Chỉ lưu kết quả do frontend/upstream tạo; endpoint không tự gọi model.
        `user_message` và `http_status` bắt buộc. Assistant chỉ được lưu khi upstream
        trả HTTP 2xx, không có `error_message`, và `assistant_message` không rỗng.
        User message cùng thông tin lỗi/upstream vẫn được lưu nếu upstream thất bại.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_bot_session, user_message, http_status]
              properties:
                chat_bot_session:
                  type: string
                  example: raw-session-token
                user_message:
                  type: string
                  example: Xin chào
                assistant_message:
                  type: string
                  nullable: true
                  example: Chào bạn!
                service_id:
                  type: string
                  example: openai
                model:
                  type: string
                  example: model-name
                upstream_response_id:
                  type: string
                  example: resp_abc123
                usage:
                  type: object
                  properties:
                    input_tokens:
                      type: integer
                      minimum: 0
                      example: 10
                    cached_tokens:
                      type: integer
                      minimum: 0
                      example: 0
                    output_tokens:
                      type: integer
                      minimum: 0
                      example: 12
                    total_tokens:
                      type: integer
                      minimum: 0
                      example: 22
                http_status:
                  type: integer
                  example: 200
                error_message:
                  type: string
                  nullable: true
                  example: null
            example:
              chat_bot_session: raw-session-token
              user_message: Xin chào
              assistant_message: Chào bạn!
              service_id: openai
              model: model-name
              upstream_response_id: resp_abc123
              usage:
                input_tokens: 10
                cached_tokens: 0
                output_tokens: 12
                total_tokens: 22
              http_status: 200
              error_message: null
      responses:
        '201':
          description: Đã lưu lượt chat.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '404':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'
        '500':
          $ref: '#/components/responses/ChatBotError'

  /api/chat/bot/rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
        example: 123
    patch:
      operationId: updateLaravelChatBotRoom
      tags: [Chat Bot]
      summary: Cập nhật phòng chat
      description: |
        Có thể gửi `title`, `status`, hoặc cả hai. Phòng có `status: 0` không hiện trong danh sách.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_bot_session]
              anyOf:
                - required: [title]
                - required: [status]
              properties:
                chat_bot_session:
                  type: string
                  example: raw-session-token
                title:
                  type: string
                  example: Tên phòng mới
                status:
                  type: integer
                  enum: [0, 1]
                  example: 1
            example:
              chat_bot_session: raw-session-token
              title: Tên phòng mới
              status: 1
      responses:
        '200':
          description: Phòng sau cập nhật.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '404':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API Token được cấp để gọi nhóm API quản lý người dùng Chat Bot.
  schemas:
    ManageError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: CHAT_BOT_MANAGE_UNAUTHORIZED
            message:
              type: string
              example: A valid bearer token is required.

    ManageValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: The status field is required.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            status:
              - The status field is required.
    ChatBotError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: CHAT_SESSION_INVALID
            message:
              type: string
              example: Chat session is invalid.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: Request downstream không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: API key hoặc agent không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    DownstreamFailure:
      description: OpenClaw Gateway hoặc agent trả lỗi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ChatBotError:
      description: Lỗi Chat Bot theo mã HTTP; nội dung dùng chung success=false và error.code/error.message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatBotError'
