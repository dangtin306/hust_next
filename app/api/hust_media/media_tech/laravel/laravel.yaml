  /api/workspaces/content/markdown/edit:
    post:
      operationId: updateWorkspaceMarkdownContentEdit
      tags: [Workspace]
      summary: Ghi nội dung mới vào file .md (POST /edit)
      description: |
        Ghi nội dung mới vào file `.md` đã tồn tại của workspace.
        Truyền `id` và `path` trên query string; nội dung mới gửi bằng JSON body `{"content": "..."}`.

        - Khi thành công, API trả `success: true`, thông tin workspace, `path` và `bytes_written`.
        - Gửi `"content": ""` sẽ làm trống file.
        - API chỉ sửa file `.md` đã có, không tạo file mới.
      security: []
      parameters:
        - name: id
          in: query
          required: true
          description: ID của workspace con trong bảng workspace.
          schema:
            type: integer
            example: 2
        - name: path
          in: query
          required: true
          description: Đường dẫn đầy đủ tương đối từ workspace root (lấy từ full_path của API cây thư mục).
          schema:
            type: string
            example: workspace-chat_bot/workspace_hust_test/SKILL.md
      requestBody:
        required: true
        description: JSON body chứa nội dung Markdown mới cần ghi vào file.
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Nội dung Markdown mới cần ghi đè vào file. Gửi chuỗi rỗng để làm trống file.
                  example: "# Nội dung Markdown mới\n..."
            examples:
              updateContent:
                summary: Ghi nội dung Markdown mới
                value:
                  content: "# Nội dung Markdown mới\n\nCập nhật tài liệu API."
              clearContent:
                summary: Làm trống file Markdown
                value:
                  content: ""
      responses:
        '200':
          description: Cập nhật nội dung file Markdown thành công.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Markdown file updated."
                  data:
                    type: object
                    required:
                      - id
                      - workspace_name
                      - work_space_code
                      - parent_workspace_code
                      - path
                      - bytes_written
                    properties:
                      id:
                        type: integer
                        example: 2
                      workspace_name:
                        type: string
                        example: Hust Workspace Test
                      work_space_code:
                        type: string
                        example: workspace_hust_test
                      parent_workspace_code:
                        type: string
                        example: workspace-chat_bot
                      path:
                        type: string
                        example: workspace-chat_bot/workspace_hust_test/SKILL.md
                      bytes_written:
                        type: integer
                        description: Số bytes đã ghi vào file.
                        example: 6483
              example:
                success: true
                message: "Markdown file updated."
                data:
                  id: 2
                  workspace_name: "Hust Workspace Test"
                  work_space_code: "workspace_hust_test"
                  parent_workspace_code: "workspace-chat_bot"
                  path: "workspace-chat_bot/workspace_hust_test/SKILL.md"
                  bytes_written: 6483
        '404':
          description: Không tìm thấy file Markdown hoặc workspace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "File không tồn tại."
        '422':
          description: Thiếu/sai id, đường dẫn path không hợp lệ hoặc không trỏ tới file .md.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Đường dẫn sai hoặc workspace không hợp lệ."
        '503':
          description: Thư mục hoặc file không truy cập được / lỗi ghi file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Thư mục hoặc file không truy cập được."

  /api/chat/bot/manage/overview:
    get:
      operationId: getChatBotManageOverview
      tags: [Manage]
      summary: Xem thống kê tổng quan
      description: |
        Xem thống kê tổng quan người dùng, session và phòng chat của Chat Bot.
        Không có query parameter hoặc request body. API này không yêu cầu Bearer token.
      responses:
        '200':
          description: Thống kê tổng quan thành công.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [users, sessions, rooms]
                    properties:
                      users:
                        type: object
                        required: [total, active, disabled, mixed_status]
                        properties:
                          total:
                            type: integer
                            example: 7
                          active:
                            type: integer
                            example: 6
                          disabled:
                            type: integer
                            example: 0
                          mixed_status:
                            type: integer
                            example: 1
                      sessions:
                        type: integer
                        example: 8
                      rooms:
                        type: object
                        required: [total, active]
                        properties:
                          total:
                            type: integer
                            example: 15
                          active:
                            type: integer
                            example: 12
