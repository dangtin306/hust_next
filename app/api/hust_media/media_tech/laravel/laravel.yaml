openapi: 3.0.3

info:
  title: Laravel Chat and Workspace API
  version: 1.0.0
  description: |
    API Laravel phục vụ quản lý phòng chat Laravel và dữ liệu workspace.
    Chat bot OpenClaw của frontend gọi Node.js Gateway qua proxy riêng;
    các API downstream OpenClaw không thuộc tài liệu Laravel này.

servers:
  - url: https://laravel.hust.media
    description: Laravel Hust API mặc định

tags:
  - name: Chat Bot
    description: |
      Các API thuộc Laravel Chat Bot cũ. Session xác thực được gửi trong JSON body
      bằng `chat_bot_session`; không dùng Bearer token, cookie hoặc user_id làm danh tính.
      Khi chưa có session, POST /api/chat/bot/rooms tạo user nội bộ và trả token một lần.
      Các mã lỗi phổ biến: 401, 403, 404, 409, 422, 429, 500 và 503.
  - name: Workspace
    description: Lấy danh sách và quản lý dữ liệu Workspace trên Laravel.
  - name: Manage
    description: |
      API quản lý người dùng Chat Bot.
      Gồm các API thống kê tổng quan, tìm kiếm và phân trang, xem chi tiết user, xem phòng chat, khóa hoặc mở user. Các API này không yêu cầu Bearer token.
  - name: Demo
    description: Các API Demo thử nghiệm và dữ liệu mẫu trên Laravel.
paths:
  /api/workspaces/main/data:
    get:
      operationId: listLaravelMainWorkspaces
      tags: [Workspace]
      summary: Lấy danh sách workspace
      description: |
        Trả danh sách workspace theo cấu trúc cây. Workspace cha `workspace-test` chứa trong
        `children` các workspace con có `parent_workspace_code = "workspace-test"`.
        Workspace cha có `is_selectable: false`; workspace con có `is_selectable: true`.
        Pagination tính theo số nút cha, các nút con luôn đi cùng cha và không tách qua trang.
        Thứ tự: `workspace-test` trước, sau đó `updated_at` mới nhất và `id` giảm dần.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: Tìm theo work_space_code, agent_code, workspace_name hoặc slug; tối đa 120 ký tự.
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          required: false
          description: Lọc theo trạng thái workspace.
          schema:
            type: string
            enum: [active, archived]
        - name: page
          in: query
          required: false
          description: Trang cần lấy.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          description: Số nút cha mỗi trang; các workspace con đi cùng nút cha.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
    ManageUnauthorized:
      description: Thiếu hoặc sai Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManageError'
          example:
            success: false
            error:
              code: CHAT_BOT_MANAGE_UNAUTHORIZED
              message: A valid bearer token is required.

    ManageUserNotFound:
      description: Không tìm thấy user hoặc session tương ứng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManageError'
          example:
            success: false
            error:
              code: CHAT_BOT_MANAGED_USER_NOT_FOUND
              message: User or session not found.

    ManageValidationError:
      description: Tham số query hoặc request body không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManageValidationError'
          example:
            message: The status field is required.
            errors:
              status:
                - The status field is required.

    ManageRateLimited:
      description: Vượt giới hạn request (mặc định 60 request/phút theo IP). Xem header Retry-After.
      headers:
        Retry-After:
          description: Số giây cần chờ trước khi thử lại
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManageError'
          example:
            success: false
            error:
              code: CHAT_BOT_MANAGE_RATE_LIMITED
              message: Too many requests. Please retry later.

    ManageNotConfigured:
      description: API quản lý chưa được cấu hình API Token trên máy chủ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManageError'
          example:
            success: false
            error:
              code: CHAT_BOT_MANAGE_API_NOT_CONFIGURED
              message: API token is not configured on server.

        '200':
          description: Danh sách workspace và phân trang.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, workspace_name, agent_code, work_space_code, status, is_selectable, children]
                      properties:
                        id:
                          type: integer
                          example: 5
                        work_space_code:
                          type: string
                          example: workspace-test
                        workspace_name:
                          type: string
                          example: Workspace Test
                        agent_code:
                          type: string
                          example: test
                        parent_workspace_code:
                          type: string
                          nullable: true
                          example: openclaw
                        slug:
                          type: string
                          example: workspace-test
                        description:
                          type: string
                          example: Workspace mẹ test
                        status:
                          type: string
                          example: active
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        is_selectable:
                          type: boolean
                          description: false cho workspace cha quản lý; true cho workspace con có thể chọn khi chat.
                          example: false
                        children:
                          type: array
                          description: Workspace con có parent_workspace_code khớp mã workspace cha.
                          items:
                            type: object
                            required: [id, workspace_name, agent_code, work_space_code, parent_workspace_code, status, is_selectable]
                            properties:
                              id:
                                type: integer
                                example: 7
                              workspace_name:
                                type: string
                                example: Workspace Tech Support
                              agent_code:
                                type: string
                                example: test
                              work_space_code:
                                type: string
                                example: workspace_tech_support
                              parent_workspace_code:
                                type: string
                                example: workspace-test
                              slug:
                                type: string
                                example: workspace-tech-support
                              description:
                                type: string
                                example: Giải thích ngắn gọn công nghệ dự án đang dùng.
                              status:
                                type: string
                                example: active
                              created_at:
                                type: string
                                format: date-time
                                example: "2026-10-05T10:09:18.000000Z"
                              updated_at:
                                type: string
                                format: date-time
                                example: "2026-10-05T10:09:18.000000Z"
                              is_selectable:
                                type: boolean
                                example: true
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        nullable: true
                        example: https://laravel.hust.media/api/workspaces/main/data?page=1
                      last:
                        type: string
                        nullable: true
                        example: https://laravel.hust.media/api/workspaces/main/data?page=1
                      prev:
                        type: string
                        nullable: true
                        example: null
                      next:
                        type: string
                        nullable: true
                        example: null
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        nullable: true
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      to:
                        type: integer
                        nullable: true
                        example: 1
                      total:
                        type: integer
                        description: Tổng số nút cấp cao nhất; không tính riêng các workspace con.
                        example: 1
              example:
                data:
                  - id: 5
                    work_space_code: workspace-test
                    workspace_name: Workspace Test
                    agent_code: test
                    parent_workspace_code: openclaw
                    slug: workspace-test
                    description: Workspace mẹ test
                    status: active
                    created_at: "2026-10-01T15:52:28.000000Z"
                    updated_at: "2026-10-01T15:52:28.000000Z"
                    is_selectable: false
                    children:
                      - id: 7
                        workspace_name: Workspace Tech Support
                        agent_code: test
                        work_space_code: workspace_tech_support
                        parent_workspace_code: workspace-test
                        slug: workspace-tech-support
                        description: Giải thích ngắn gọn công nghệ dự án đang dùng.
                        status: active
                        created_at: "2026-10-05T10:09:18.000000Z"
                        updated_at: "2026-10-05T10:09:18.000000Z"
                        is_selectable: true
                links:
                  first: https://laravel.hust.media/api/workspaces/main/data?page=1
                  last: https://laravel.hust.media/api/workspaces/main/data?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  per_page: 20
                  to: 1
                  total: 1
    post:
      operationId: updateLaravelMainWorkspace
      tags: [Workspace]
      summary: Sửa một workspace
      description: |
        Cập nhật đúng một workspace theo `id`. Gửi một request POST cho mỗi workspace;
        không gửi nhiều workspace trong cùng một request. Các trường không gửi, có giá trị
        `null`, chuỗi rỗng hoặc chỉ chứa khoảng trắng sẽ được bỏ qua. Giá trị `false` và `0`
        vẫn được xử lý bình thường. Muốn sửa nhiều trường của cùng workspace, gửi chúng chung
        trong một request. Để cập nhật workspace khác, gửi request riêng với `id` tương ứng.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  description: ID của workspace cần cập nhật.
                  example: 4
                agent_code:
                  type: string
                  nullable: true
                  description: Mã agent.
                  example: test
                work_space_code:
                  type: string
                  nullable: true
                  description: Mã workspace.
                  example: workspace_hust_users
                workspace_name:
                  type: string
                  nullable: true
                  description: Tên workspace.
                  example: Workspace Hust Users
                parent_workspace_code:
                  type: string
                  nullable: true
                  description: Mã workspace cha.
                  example: openclaw
                slug:
                  type: string
                  nullable: true
                  description: Slug của workspace.
                  example: workspace-hust-users
                description:
                  type: string
                  nullable: true
                  description: Mô tả workspace.
                  example: Hướng dẫn sử dụng workspace Hust.
                status:
                  type: string
                  nullable: true
                  enum: [active, archived]
                  description: Trạng thái workspace.
                  example: active
            examples:
              renameWorkspace:
                summary: Đổi tên workspace
                value:
                  id: 4
                  workspace_name: Workspace Hust Users mới
              updateMultipleFields:
                summary: Cập nhật nhiều trường của cùng workspace
                value:
                  id: 4
                  workspace_name: Workspace Hust Users
                  description: Hướng dẫn sử dụng workspace Hust.
                  status: active
      responses:
        '200':
          description: Workspace sau khi cập nhật.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    description: Bản ghi workspace đã cập nhật.
                    properties:
                      id:
                        type: integer
                        example: 4
                      agent_code:
                        type: string
                        example: test
                      work_space_code:
                        type: string
                        example: workspace_hust_users
                      workspace_name:
                        type: string
                        example: Workspace Hust Users
                      parent_workspace_code:
                        type: string
                        nullable: true
                        example: openclaw
                      slug:
                        type: string
                        example: workspace-hust-users
                      description:
                        type: string
                        example: Hướng dẫn sử dụng workspace Hust.
                      status:
                        type: string
                        example: active
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
              example:
                data:
                  id: 4
                  agent_code: test
                  work_space_code: workspace_hust_users
                  workspace_name: Workspace Hust Users mới
                  parent_workspace_code: openclaw
                  slug: workspace-hust-users
                  description: Hướng dẫn sử dụng workspace Hust.
                  status: active
                  created_at: "2026-10-01T15:52:28.000000Z"
                  updated_at: "2026-10-15T12:00:00.000000Z"

  /api/workspaces/user/data:
    get:
      operationId: listUserWorkspaces
      tags: [Workspace]
      summary: Lấy workspace của user
      description: |
        Trả về các workspace có session đang `active` của user. Laravel đối chiếu
        `user_id` với cột `upstream_user_id` trong bảng `work_space_session`.

        Mặc định tra user `502`, không cần truyền query parameter. Có thể truyền
        `user_id` để tra user khác, ví dụ `/api/workspaces/user/data?user_id=123`;
        nếu user không có session active, `data` là mảng rỗng.
      security: []
      parameters:
        - name: user_id
          in: query
          required: false
          description: User ID cần tra; mặc định là 502.
          schema:
            type: integer
            minimum: 1
            default: 502
          example: 502
      responses:
        '200':
          description: Danh sách workspace có session active của user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - workspace_name
                        - agent_code
                        - work_space_code
                        - parent_workspace_code
                        - slug
                        - status
                      properties:
                        id:
                          type: integer
                          example: 4
                        workspace_name:
                          type: string
                          example: Hỗ trợ OpenClaw
                        agent_code:
                          type: string
                          example: test
                        work_space_code:
                          type: string
                          example: workspace_openclaw_support
                        parent_workspace_code:
                          type: string
                          example: workspace-test
                        slug:
                          type: string
                          example: workspace-openclaw-support
                        description:
                          type: string
                          example: Hỗ trợ cấu hình OpenClaw
                        status:
                          type: string
                          example: active
                        created_at:
                          type: string
                          format: date-time
                          example: "2026-10-01T08:52:28.000000Z"
                        updated_at:
                          type: string
                          format: date-time
                          example: "2026-10-02T09:14:06.000000Z"
              examples:
                activeWorkspaces:
                  summary: User có workspace active
                  value:
                    data:
                      - id: 4
                        workspace_name: Hỗ trợ OpenClaw
                        agent_code: test
                        work_space_code: workspace_openclaw_support
                        parent_workspace_code: workspace-test
                        slug: workspace-openclaw-support
                        description: Hỗ trợ cấu hình OpenClaw
                        status: active
                        created_at: "2026-10-01T08:52:28.000000Z"
                        updated_at: "2026-10-02T09:14:06.000000Z"
                noActiveWorkspaces:
                  summary: User không có session active
                  value:
                    data: []

  /api/workspaces/routing/update:
    get:
      operationId: getWorkspaceRoutingUpdate
      tags: [Workspace]
      summary: Đồng bộ routing workspace (GET)
      description: |
        Đồng bộ workspace con của `workspace-test`. Laravel lấy danh sách từ Node API
        `GET /openclaw/v2/list` rồi cập nhật bảng `work_space_main`.

        Workspace mẹ không bị sửa; workspace con không bị xóa chỉ vì vắng mặt trong
        danh sách Node. Không cần query parameters hoặc request body.
      security: []
      responses:
        '200':
          description: Đồng bộ routing workspace thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRoutingUpdateResult'
              example:
                success: true
        '404':
          description: Không tìm thấy workspace mẹ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRoutingUpdateResult'
              example:
                success: false
        '409':
          description: Workspace mẹ chưa có agent_code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRoutingUpdateResult'
              example:
                success: false
        '500':
          description: Lỗi nội bộ khi đồng bộ workspace routing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRoutingUpdateResult'
              example:
                success: false
        '502':
          description: Node không phản hồi hoặc trả dữ liệu không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRoutingUpdateResult'
              example:
                success: false

  /api/workspaces/main/markdown:
    get:
      operationId: getWorkspaceMainMarkdown
      tags: [Workspace]
      summary: Xem cấu trúc Markdown của workspace
      description: |
        Xem cây thư mục và danh sách file Markdown (`.md`) của workspace con theo `id`.
        API chỉ nhận workspace con trực tiếp của `WORKSPACE_PARENT_CODE` (mặc định là `workspace-test`).
        API trả cây thư mục và tên, đường dẫn các file `.md`, không trả nội dung file.

        Đường dẫn Laravel đọc thư mục theo mẫu:
        `{OPENCLAW_WORKSPACES_PATH}/{WORKSPACE_PARENT_CODE}/{work_space_code}`
      security: []
      parameters:
        - name: id
          in: query
          required: true
          description: ID workspace con trong bảng `work_space_main`.
          schema:
            type: integer
            example: 8
      responses:
        '200':
          description: Cấu trúc cây thư mục và file Markdown của workspace con.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - workspace_name
                      - work_space_code
                      - parent_workspace_code
                      - relative_path
                      - markdown_count
                      - tree
                    properties:
                      id:
                        type: integer
                        example: 8
                      workspace_name:
                        type: string
                        example: Hướng dẫn đấu API
                      work_space_code:
                        type: string
                        example: workspace_tech_api
                      parent_workspace_code:
                        type: string
                        example: workspace-test
                      relative_path:
                        type: string
                        example: workspace-test/workspace_tech_api
                      markdown_count:
                        type: integer
                        example: 1
                      tree:
                        type: array
                        description: Cây thư mục và tên, đường dẫn file .md.
                        items:
                          type: object
                          required: [type, name, path]
                          properties:
                            type:
                              type: string
                              enum: [file, directory]
                              example: file
                            name:
                              type: string
                              example: SKILL.md
                            path:
                              type: string
                              example: SKILL.md
                            full_path:
                              type: string
                              description: Đường dẫn đầy đủ tương đối với workspace root, dùng làm path khi gọi API đọc nội dung.
                              example: workspace-chat_bot/workspace_hust_test/SKILL.md
                            children:
                              type: array
                              description: Danh sách con nếu type là directory.
                              items:
                                type: object
              example:
                data:
                  id: 2
                  workspace_name: "Hust Workspace Test"
                  work_space_code: "workspace_hust_test"
                  parent_workspace_code: "workspace-chat_bot"
                  relative_path: "workspace-chat_bot/workspace_hust_test"
                  markdown_count: 1
                  tree:
                    - type: "file"
                      name: "SKILL.md"
                      path: "SKILL.md"
                      full_path: "workspace-chat_bot/workspace_hust_test/SKILL.md"
        '404':
          description: Không tìm thấy workspace theo `id` hoặc thư mục của workspace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Không tìm thấy workspace theo id hoặc thư mục của workspace."
        '422':
          description: Thiếu/sai `id`, mã thư mục không hợp lệ hoặc workspace không phải con trực tiếp của workspace cha đã cấu hình.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Thiếu/sai id hoặc workspace không phải con trực tiếp."
        '503':
          description: Laravel không đọc được thư mục workspace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Laravel không đọc được thư mục workspace."

  /api/workspaces/content/markdown/full:
    get:
      operationId: getWorkspaceMarkdownContentFull
      tags: [Workspace]
      summary: Lấy toàn bộ nội dung Markdown của workspace (cây thư mục & nội dung file)
      description: |
        Dùng API này để frontend lấy cây thư mục và nội dung của tất cả file `.md` trong một workspace con chỉ bằng một request.

        Workspace phải là workspace con theo cấu hình của project:
        - Media Tech: workspace mẹ là `workspace-test` (https://laravel_mt.hust.media)
        - Hust: workspace mẹ là `workspace-chat_bot` (https://laravel.hust.media)

        ### Ý nghĩa các trường response
        - `relative_path`: đường dẫn workspace tính từ thư mục gốc OpenClaw workspaces.
        - `tree`: cây thư mục, chỉ gồm thư mục có chứa file `.md` và các file `.md`.
        - `type`: `directory` là thư mục, `file` là file Markdown.
        - `path`: đường dẫn tương đối bên trong workspace; dùng để xác định file khi gọi API đọc hoặc sửa file.
        - `full_path`: đường dẫn tương đối từ thư mục gốc OpenClaw workspaces.
        - `content`: toàn bộ nội dung file Markdown.
        - `size_bytes`: kích thước nội dung file tính bằng byte.
        - `markdown_count`: tổng số file `.md` tìm được trong workspace.

        Frontend có thể duyệt đệ quy `tree`: hiển thị các node `directory`, rồi hiển thị `content` của từng node `file`.
        Vì API trả nội dung đầy đủ, không cần gọi API đọc riêng cho từng file để dựng màn hình workspace.
      security: []
      parameters:
        - name: id
          in: query
          required: true
          description: ID workspace trong database. Workspace phải là workspace con theo cấu hình project.
          schema:
            type: integer
            example: 8
      responses:
        '200':
          description: Cây thư mục kèm toàn bộ nội dung Markdown của workspace con thành công.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - workspace_name
                      - work_space_code
                      - parent_workspace_code
                      - relative_path
                      - markdown_count
                      - tree
                    properties:
                      id:
                        type: integer
                        example: 8
                      workspace_name:
                        type: string
                        example: Hướng dẫn đấu API
                      work_space_code:
                        type: string
                        example: workspace_tech_api
                      parent_workspace_code:
                        type: string
                        example: workspace-test
                      relative_path:
                        type: string
                        example: workspace-test/workspace_tech_api
                      markdown_count:
                        type: integer
                        example: 5
                      tree:
                        type: array
                        description: Cây thư mục gồm thư mục chứa file .md và các file .md kèm toàn bộ nội dung content.
                        items:
                          type: object
                          required: [type, name, path, full_path]
                          properties:
                            type:
                              type: string
                              enum: [file, directory]
                              example: file
                            name:
                              type: string
                              example: SKILL.md
                            path:
                              type: string
                              example: SKILL.md
                            full_path:
                              type: string
                              example: workspace-test/workspace_tech_api/SKILL.md
                            content:
                              type: string
                              description: Toàn bộ nội dung file Markdown.
                              example: "# Hướng dẫn đấu API..."
                            size_bytes:
                              type: integer
                              description: Kích thước file tính bằng byte.
                              example: 1250
                            children:
                              type: array
                              description: Danh sách con nếu type là directory.
                              items:
                                type: object
              example:
                data:
                  id: 8
                  workspace_name: "Hướng dẫn đấu API"
                  work_space_code: "workspace_tech_api"
                  parent_workspace_code: "workspace-test"
                  relative_path: "workspace-test/workspace_tech_api"
                  markdown_count: 5
                  tree:
                    - type: "file"
                      name: "SKILL.md"
                      path: "SKILL.md"
                      full_path: "workspace-test/workspace_tech_api/SKILL.md"
                      content: "# Hướng dẫn đấu API..."
                      size_bytes: 1250
                    - type: "directory"
                      name: "workspaces"
                      path: "workspaces"
                      full_path: "workspace-test/workspace_tech_api/workspaces"
                      children:
                        - type: "file"
                          name: "api-map-and-flow.md"
                          path: "workspaces/api-map-and-flow.md"
                          full_path: "workspace-test/workspace_tech_api/workspaces/api-map-and-flow.md"
                          content: "# Luồng request/response..."
                          size_bytes: 3990
        '404':
          description: Không tìm thấy workspace hoặc thư mục workspace trên ổ đĩa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Không tìm thấy workspace theo id hoặc thư mục của workspace."
        '422':
          description: Thiếu `id`, `id` không hợp lệ hoặc workspace không phải con trực tiếp (workspace_child_required).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Workspace con được yêu cầu (workspace_child_required) hoặc id không hợp lệ."
        '503':
          description: Laravel không đọc được thư mục hoặc file Markdown (workspace_content_unavailable).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Laravel không đọc được thư mục hoặc file Markdown."

  /api/workspaces/content/markdown:
