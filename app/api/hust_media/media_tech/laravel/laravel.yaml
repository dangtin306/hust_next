  /api/chat/bot/rooms:
    get:
      operationId: getLaravelChatBotRooms
      tags: [Chat Bot]
      summary: Lấy danh sách phòng (GET cũ)
      description: GET route vẫn tồn tại nhưng client nên dùng POST `/rooms/list`, vì GET body không được hỗ trợ ổn định.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_bot_session]
              properties:
                chat_bot_session:
                  type: string
                  example: raw-session-token
      responses:
        '200':
          description: Danh sách phòng.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'
    post:
      operationId: createLaravelChatBotRoom
      tags: [Chat Bot]
      summary: Tạo hoặc liên kết phòng chat
      description: |
        `upstream_conversation_id` có thể bỏ qua; khi bỏ qua Laravel sẽ yêu cầu
        OpenClaw tạo conversation. Lần đầu tạo session, response trả
        `data.chat_bot_session`; lưu token này để gửi trong JSON body ở các request sau.
        Nếu conversation đã liên kết với user khác, trả HTTP 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_bot_session:
                  type: string
                  description: Token session hiện có; bỏ qua khi tạo session lần đầu.
                title:
                  type: string
                  maxLength: 255
                  example: Cuộc trò chuyện mới
                model:
                  type: string
                  maxLength: 128
                  example: gpt-5.6-luna
                agent:
                  type: string
                  maxLength: 100
                  example: chat_bot
                upstream_conversation_id:
                  type: string
                  maxLength: 255
                  example: conversation-id
            example:
              title: Cuộc trò chuyện mới
              model: model-name
              agent: chat_bot
              upstream_conversation_id: conversation-id
      responses:
        '200':
          description: Phòng đã được liên kết.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '201':
          description: Đã tạo phòng mới.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      room_id:
                        type: integer
                        example: 123
                      upstream_conversation_id:
                        type: string
                        example: conversation-id
                      title:
                        type: string
                        example: Cuộc trò chuyện mới
                      model:
                        type: string
                        example: model-name
                      agent:
                        type: string
                        example: chat_bot
                      status:
                        type: integer
                        example: 1
                      created_at:
                        type: string
                        format: date-time
                        example: "2026-10-01T10:00:00Z"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2026-10-01T10:00:00Z"
                      chat_bot_session:
                        type: string
                        description: Token thô chỉ trả khi tạo session lần đầu.
                        example: raw-session-token
        '409':
          description: Conversation đã liên kết với user khác.
        '503':
          description: Không tạo được phòng, thường do cần gọi OpenClaw.
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'
        '500':
          $ref: '#/components/responses/ChatBotError'

