        content:
          application/json:
            schema:
              type: object
              required: [chat_bot_session]
              properties:
                chat_bot_session:
                  type: string
                  example: raw-session-token
      responses:
        '200':
          description: Lịch sử tin nhắn.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '404':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'
    post:
      operationId: saveLaravelChatBotTurn
      tags: [Chat Bot]
      summary: Lưu một lượt chat
      description: |
        Chỉ lưu kết quả do frontend/upstream tạo; endpoint không tự gọi model.
        `user_message` và `http_status` bắt buộc. Assistant chỉ được lưu khi upstream
        trả HTTP 2xx, không có `error_message`, và `assistant_message` không rỗng.
        User message cùng thông tin lỗi/upstream vẫn được lưu nếu upstream thất bại.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_bot_session, user_message, http_status]
              properties:
                chat_bot_session:
                  type: string
                  example: raw-session-token
                user_message:
                  type: string
                  example: Xin chào
                assistant_message:
                  type: string
                  nullable: true
                  example: Chào bạn!
                service_id:
                  type: string
                  example: openai
                model:
                  type: string
                  example: model-name
                upstream_response_id:
                  type: string
                  example: resp_abc123
                usage:
                  type: object
                  properties:
                    input_tokens:
                      type: integer
                      minimum: 0
                      example: 10
                    cached_tokens:
                      type: integer
                      minimum: 0
                      example: 0
                    output_tokens:
                      type: integer
                      minimum: 0
                      example: 12
                    total_tokens:
                      type: integer
                      minimum: 0
                      example: 22
                http_status:
                  type: integer
                  example: 200
                error_message:
                  type: string
                  nullable: true
                  example: null
            example:
              chat_bot_session: raw-session-token
              user_message: Xin chào
              assistant_message: Chào bạn!
              service_id: openai
              model: model-name
              upstream_response_id: resp_abc123
              usage:
                input_tokens: 10
                cached_tokens: 0
                output_tokens: 12
                total_tokens: 22
              http_status: 200
              error_message: null
      responses:
        '201':
          description: Đã lưu lượt chat.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '404':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'
        '500':
          $ref: '#/components/responses/ChatBotError'

  /api/chat/bot/rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
        example: 123
    patch:
      operationId: updateLaravelChatBotRoom
      tags: [Chat Bot]
      summary: Cập nhật phòng chat
      description: |
        Có thể gửi `title`, `status`, hoặc cả hai. Phòng có `status: 0` không hiện trong danh sách.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_bot_session]
              anyOf:
                - required: [title]
                - required: [status]
              properties:
                chat_bot_session:
                  type: string
                  example: raw-session-token
                title:
                  type: string
                  example: Tên phòng mới
                status:
                  type: integer
                  enum: [0, 1]
                  example: 1
            example:
              chat_bot_session: raw-session-token
              title: Tên phòng mới
              status: 1
      responses:
        '200':
          description: Phòng sau cập nhật.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '404':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
        '429':
          $ref: '#/components/responses/ChatBotError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API Token được cấp để gọi nhóm API quản lý người dùng Chat Bot.
  schemas:
    ManageError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: CHAT_BOT_MANAGE_UNAUTHORIZED
            message:
              type: string
              example: A valid bearer token is required.

    ManageValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: The status field is required.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            status:
              - The status field is required.
    WorkspaceRoutingUpdateResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    ChatBotError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: CHAT_SESSION_INVALID
            message:
              type: string
              example: Chat session is invalid.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: Request downstream không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: API key hoặc agent không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    DownstreamFailure:
      description: OpenClaw Gateway hoặc agent trả lỗi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ChatBotError:
      description: Lỗi Chat Bot theo mã HTTP; nội dung dùng chung success=false và error.code/error.message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatBotError'
