                    properties:
                      per_page:
                        type: integer
                        example: 50
                      has_more:
                        type: boolean
                        example: true
                      next_before_id:
                        type: integer
                        example: 456
        '401':
          $ref: '#/components/responses/ChatBotError'
        '403':
          $ref: '#/components/responses/ChatBotError'
        '404':
          $ref: '#/components/responses/ChatBotError'
        '422':
          $ref: '#/components/responses/ChatBotError'
