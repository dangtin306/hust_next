    patch:
      operationId: bulkUpdateLaravelChatBotMessageStatus
      tags: [Messages, Chat Bot]
      summary: Cập nhật trạng thái nhiều tin nhắn cùng lúc
      description: |
        Cập nhật trạng thái nhiều tin nhắn cùng lúc. `message_ids` cần có từ 1 đến 100 ID số nguyên, không trùng nhau. `status` nhận 0 hoặc 1.
        
        Nếu thành công, `data` trả về `message_ids`, `status` và `matched_count`.
        Nếu có ID không tồn tại, API trả về `404` cùng danh sách `missing_ids` và không cập nhật tin nhắn nào.
        
        **Controller:** `Mess_Controller.php`  
        **Service:** `Mess_History.php`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids, status]
              properties:
                message_ids:
                  type: array
                  items:
                    type: integer
                  minItems: 1
                  maxItems: 100
                  description: "Danh sách từ 1 đến 100 ID số nguyên, không trùng nhau"
                  example: [10101, 10102, 10103]
                status:
                  type: integer
                  enum: [0, 1]
                  description: "Trạng thái mới: 1 là hiển thị, 0 là ẩn"
                  example: 0
      responses:
        '200':
          description: Cập nhật trạng thái hàng loạt thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message_ids:
                        type: array
                        items:
                          type: integer
                        example: [10101, 10102, 10103]
                      status:
                        type: integer
                        example: 0
                      matched_count:
                        type: integer
                        example: 3
        '404':
          description: Không tìm thấy một số tin nhắn
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Một số tin nhắn không tồn tại"
                      missing_ids:
                        type: array
                        items:
                          type: integer
                        example: [99999]
        '422':
          $ref: '#/components/responses/ChatBotError'

