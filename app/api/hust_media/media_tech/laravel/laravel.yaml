  /api/chat/bot/manage/users:
    get:
      operationId: listChatBotManageUsers
      tags: [Manage]
      summary: Tìm kiếm, lọc và phân trang người dùng
      description: |
        Tìm kiếm và phân trang người dùng. Có thể tìm chính xác bằng `q=user_123` hoặc `q=guest_456`.
        Từ khóa số như `q=123` tìm các ID có chứa số đó. Danh sách được sắp theo thời gian hoạt động gần nhất. API này không yêu cầu Bearer token.
      parameters:
        - name: q
          in: query
          required: false
          description: Tìm theo ID user/guest hoặc một phần ID dạng số; tối đa 120 ký tự.
          schema:
            type: string
            maxLength: 120
            example: user_123
        - name: status
          in: query
          required: false
          description: Lọc theo active, disabled hoặc mixed.
          schema:
            type: string
            enum: [active, disabled, mixed]
            example: active
        - name: per_page
          in: query
          required: false
          description: Số user mỗi trang; từ 1 đến 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: page
          in: query
          required: false
          description: Số trang cần lấy.
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
      responses:
        '200':
          description: Lấy danh sách người dùng thành công.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      required: [user_id, session_count, active_session_count, disabled_session_count, room_count, created_at, status]
                      properties:
                        user_id:
                          type: string
                          example: user_123
                        upstream_user_id:
                          type: integer
                          nullable: true
                          example: 123
                        session_count:
                          type: integer
                          example: 2
                        active_session_count:
                          type: integer
                          example: 2
                        disabled_session_count:
                          type: integer
                          example: 0
                        room_count:
                          type: integer
                          example: 5
                        last_activity_at:
                          type: string
                          nullable: true
                          example: "2026-10-18 10:20:30"
                        created_at:
                          type: string
                          example: "2026-10-10 08:00:00"
                        status:
                          type: string
                          enum: [active, disabled, mixed]
                          example: active
                  meta:
                    type: object
                    required: [current_page, per_page, total, last_page]
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
        '422':
          $ref: '#/components/responses/ManageValidationError'
        '429':
          $ref: '#/components/responses/ManageRateLimited'
        '503':
          $ref: '#/components/responses/ManageNotConfigured'

  /api/chat/bot/manage/users/{userId}:
