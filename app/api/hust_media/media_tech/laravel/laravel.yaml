openapi: 3.0.3

info:
  title: Laravel Chat API
  version: 1.0.0
  description: |
    API Laravel phục vụ quản lý phòng chat và lịch sử hội thoại.
    Chat bot OpenClaw của frontend gọi Node.js Gateway qua proxy riêng;
    các API downstream OpenClaw không thuộc tài liệu Laravel này.

servers:
  - url: https://laravel.hust.media
    description: Laravel Hust API mặc định

tags:
  - name: Chat Bot
    description: |
      Các API thuộc Laravel Chat Bot cũ. Session xác thực được gửi trong JSON body
      bằng `chat_bot_session`; không dùng Bearer token, cookie hoặc user_id làm danh tính.
      Khi chưa có session, POST /api/chat/bot/rooms tạo user nội bộ và trả token một lần.
      Các mã lỗi phổ biến: 401, 403, 404, 409, 422, 429, 500 và 503.
  - name: Manage
    description: |
      API quản lý user, session, phòng chat và lịch sử tin nhắn.
      Gồm các API xem tổng quan (overview), tìm kiếm/lọc/phân trang user, chi tiết user và session, khóa/mở user, xem phòng của user, xem tin nhắn của user trên tất cả phòng chat, tìm kiếm và lọc phòng toàn hệ thống, xem chi tiết phòng, xem lịch sử tin nhắn phòng, đổi tiêu đề/trạng thái phòng và lưu trữ mềm phòng. Các API bên dưới không yêu cầu Bearer token.
  - name: Messages
    description: |
      API tìm kiếm, xem và quản lý trạng thái tin nhắn. Tin nhắn có status = 1 đang hiển thị; status = 0 đã ẩn.
      Gồm các API tìm kiếm/lọc tin nhắn (theo user_id, room_id, role, status, khoảng ngày), xem lịch sử phòng, xem chi tiết tin nhắn, ẩn hoặc khôi phục tin nhắn, ẩn mềm tin nhắn và cập nhật trạng thái hàng loạt (bulk-status).
      Controller: Mess_Controller.php, Service: Mess_History.php. Các API bên dưới không yêu cầu Bearer token.
  - name: Demo
    description: Các API Demo thử nghiệm và dữ liệu mẫu trên Laravel.
paths:
  /api/chat/bot/manage/overview:
    get:
      operationId: getChatBotManageOverview
      tags: [Manage]
      summary: Xem thống kê tổng quan
      description: |
        Xem thống kê tổng quan người dùng, session và phòng chat của Chat Bot.
        Không có query parameter hoặc request body. API này không yêu cầu Bearer token.
      responses:
        '200':
          description: Thống kê tổng quan thành công.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [users, sessions, rooms]
                    properties:
                      users:
                        type: object
                        required: [total, active, disabled, mixed_status]
                        properties:
                          total:
                            type: integer
                            example: 7
                          active:
                            type: integer
                            example: 6
                          disabled:
                            type: integer
                            example: 0
                          mixed_status:
                            type: integer
                            example: 1
                      sessions:
                        type: integer
                        example: 8
                      rooms:
                        type: object
                        required: [total, active, archived]
                        properties:
                          total:
                            type: integer
                            example: 15
                          active:
                            type: integer
                            example: 12
                          archived:
                            type: integer
                            example: 3
                      messages:
                        type: object
                        required: [total, active, hidden]
                        properties:
                          total:
                            type: integer
                            example: 619
                          active:
                            type: integer
                            example: 590
                          hidden:
                            type: integer
                            example: 29
        '429':
          $ref: '#/components/responses/ManageRateLimited'
        '503':
          $ref: '#/components/responses/ManageNotConfigured'

  /api/chat/bot/manage/users:
    get:
      operationId: listChatBotManageUsers
      tags: [Manage]
      summary: Tìm kiếm, lọc và phân trang người dùng
      description: |
        Tìm kiếm và phân trang người dùng. Có thể tìm chính xác bằng `q=user_123` hoặc `q=guest_456`.
        Từ khóa số như `q=123` tìm các ID có chứa số đó. Danh sách được sắp theo thời gian hoạt động gần nhất. API này không yêu cầu Bearer token.
      parameters:
        - name: q
          in: query
          required: false
          description: Tìm theo ID user/guest hoặc một phần ID dạng số; tối đa 120 ký tự.
          schema:
            type: string
            maxLength: 120
            example: user_123
        - name: status
          in: query
          required: false
          description: Lọc theo active, disabled hoặc mixed.
          schema:
            type: string
            enum: [active, disabled, mixed]
            example: active
        - name: per_page
          in: query
          required: false
          description: Số user mỗi trang; từ 1 đến 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: page
          in: query
          required: false
          description: Số trang cần lấy.
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
      responses:
        '200':
          description: Lấy danh sách người dùng thành công.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      required: [user_id, session_count, active_session_count, disabled_session_count, room_count, created_at, status]
                      properties:
                        user_id:
                          type: string
                          example: user_123
                        upstream_user_id:
                          type: integer
                          nullable: true
                          example: 123
                        session_count:
                          type: integer
                          example: 2
                        active_session_count:
                          type: integer
                          example: 2
                        disabled_session_count:
                          type: integer
                          example: 0
                        room_count:
                          type: integer
                          example: 5
                        last_activity_at:
                          type: string
                          nullable: true
                          example: "2026-10-18 10:20:30"
                        created_at:
                          type: string
                          example: "2026-10-10 08:00:00"
                        status:
                          type: string
                          enum: [active, disabled, mixed]
                          example: active
                  meta:
                    type: object
                    required: [current_page, per_page, total, last_page]
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
        '422':
          $ref: '#/components/responses/ManageValidationError'
        '429':
          $ref: '#/components/responses/ManageRateLimited'
        '503':
          $ref: '#/components/responses/ManageNotConfigured'

  /api/chat/bot/manage/users/{userId}:
    get:
      operationId: getChatBotManageUserDetail
      tags: [Manage]
      summary: Xem chi tiết người dùng và các session
      description: |
        Xem chi tiết người dùng và danh sách session trực thuộc theo `userId`.
        `userId` có định dạng `user_123` (liên kết ngoài) hoặc `guest_456` (guest session). API này không yêu cầu Bearer token.
      parameters:
        - name: userId
          in: path
          required: true
          description: Định dạng user_123 hoặc guest_456.
          schema:
            type: string
            pattern: '^(user|guest)_[1-9][0-9]*$'
            example: user_123
      responses:
        '200':
          description: Chi tiết người dùng thành công.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [user_id, session_count, active_session_count, disabled_session_count, room_count, created_at, status, sessions]
                    properties:
                      user_id:
                        type: string
                        example: user_123
                      upstream_user_id:
                        type: integer
                        nullable: true
                        example: 123
                      session_count:
                        type: integer
                        example: 2
                      active_session_count:
                        type: integer
                        example: 2
                      disabled_session_count:
                        type: integer
                        example: 0
                      room_count:
                        type: integer
                        example: 5
                      last_activity_at:
                        type: string
                        nullable: true
                        example: "2026-10-18 10:20:30"
                      created_at:
                        type: string
                        example: "2026-10-10 08:00:00"
                      status:
                        type: string
                        enum: [active, disabled, mixed]
                        example: active
                      sessions:
                        type: array
                        items:
                          type: object
                          required: [id, status, created_at, updated_at]
                          properties:
                            id:
                              type: integer
                              example: 456
                            status:
                              type: integer
                              example: 1
                            created_at:
                              type: string
                              example: "2026-10-10 08:00:00"
                            updated_at:
                              type: string
                              example: "2026-10-18 10:20:30"
        '404':
          $ref: '#/components/responses/ManageUserNotFound'
        '429':
          $ref: '#/components/responses/ManageRateLimited'
        '503':
          $ref: '#/components/responses/ManageNotConfigured'
    patch:
      operationId: updateChatBotManageUserStatus
      tags: [Manage]
      summary: Khóa hoặc mở người dùng
      description: |
        Cập nhật trạng thái khóa/mở người dùng.
        - `status = 0`: khóa tất cả session thuộc user.
        - `status = 1`: mở tất cả session thuộc user.
        Với `guest_456`, thao tác chỉ ảnh hưởng session guest đó. API này không yêu cầu Bearer token.
      parameters:
        - name: userId
          in: path
          required: true
          description: Định dạng user_123 hoặc guest_456.
          schema:
            type: string
            pattern: '^(user|guest)_[1-9][0-9]*$'
            example: user_123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: integer
                  enum: [0, 1]
                  description: "0: khóa user/session, 1: mở lại user/session"
                  example: 0
      responses:
        '200':
          description: Cập nhật trạng thái người dùng thành công.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [user_id, status, session_count, changed_session_count]
                    properties:
                      user_id:
                        type: string
                        example: user_123
                      status:
                        type: string
                        enum: [active, disabled]
                        example: disabled
                      session_count:
                        type: integer
                        example: 2
                      changed_session_count:
                        type: integer
                        example: 2
        '404':
          $ref: '#/components/responses/ManageUserNotFound'
        '422':
          $ref: '#/components/responses/ManageValidationError'
        '429':
          $ref: '#/components/responses/ManageRateLimited'
        '503':
          $ref: '#/components/responses/ManageNotConfigured'

  /api/chat/bot/manage/users/{userId}/rooms:
    get:
      operationId: listChatBotManageUserRooms
      tags: [Manage]
      summary: Xem phòng chat của người dùng
      description: |
        Lấy danh sách metadata phòng chat của người dùng theo `userId`.
        Danh sách được sắp xếp theo thời gian cập nhật gần nhất. Không trả nội dung tin nhắn. API này không yêu cầu Bearer token.
      parameters:
        - name: userId
          in: path
          required: true
          description: Định dạng user_123 hoặc guest_456.
          schema:
            type: string
            pattern: '^(user|guest)_[1-9][0-9]*$'
            example: user_123
        - name: per_page
          in: query
          required: false
          description: Số phòng mỗi trang; từ 1 đến 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: page
          in: query
          required: false
          description: Số trang cần lấy.
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
      responses:
        '200':
          description: Lấy danh sách phòng chat thành công.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, id_chat_users, title, status, model, created_at, updated_at]
                      properties:
                        id:
                          type: integer
                          example: 789
                        id_chat_users:
                          type: integer
                          example: 456
                        title:
                          type: string
                          example: Trao đổi về API
                        status:
                          type: integer
                          example: 1
                        model:
                          type: string
                          example: model-name
                        agent:
                          type: string
                          nullable: true
                          example: null
                        created_at:
                          type: string
                          example: "2026-10-12 08:00:00"
                        updated_at:
                          type: string
                          example: "2026-10-18 10:20:30"
                  meta:
                    type: object
                    required: [current_page, per_page, total, last_page]
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
        '404':
          $ref: '#/components/responses/ManageUserNotFound'
        '422':
          $ref: '#/components/responses/ManageValidationError'
        '429':
          $ref: '#/components/responses/ManageRateLimited'
        '503':
          $ref: '#/components/responses/ManageNotConfigured'

  /api/chat/bot/manage/users/{userId}/messages:
    get:
      operationId: listChatBotManageUserMessages
      tags: [Manage]
      summary: Xem tin nhắn của user trên tất cả phòng
      description: |
        Xem tin nhắn của user trên tất cả phòng chat của họ. User được xác định từ `{userId}` trên URL.
        
        API này không yêu cầu Bearer token.
      parameters:
        - name: userId
          in: path
          required: true
          description: "Định dạng user_123 hoặc guest_456."
          schema:
            type: string
            pattern: "^(user|guest)_[1-9][0-9]*$"
            example: user_123
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: "Tìm trong nội dung tin nhắn"
          example: "học bổng"
        - name: room_id
          in: query
          required: false
          schema:
            type: integer
          description: "Lọc theo ID phòng"
          example: 1001
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [user, assistant, system]
          description: "Lọc theo vai trò"
          example: user
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: "Lọc theo trạng thái (1: hiển thị, 0: ẩn)"
          example: 1
        - name: created_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Lọc từ khoảng ngày tạo (Y-m-d H:i:s hoặc ISO 8601)"
          example: "2026-10-01 00:00:00"
        - name: created_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Lọc đến khoảng ngày tạo (Y-m-d H:i:s hoặc ISO 8601)"
          example: "2026-10-18 23:59:59"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: "Số trang, mặc định 1"
          example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
          description: "Số kết quả mỗi trang (mặc định 20, tối đa 100)"
          example: 20
      responses:
        '200':
          description: Danh sách tin nhắn của user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 10101
                        id_chat_rooms:
                          type: integer
                          example: 1001
                        role:
                          type: string
                          example: user
                        content:
                          type: string
                          example: "Chào bạn, tư vấn tuyển sinh giúp tôi."
                        status:
                          type: integer
                          example: 1
                        model:
                          type: string
                          example: "gpt-4o-mini"
                        service_id:
                          type: string
                          example: "media_text_to_text"
                        created_at:
                          type: string
                          example: "2026-10-18 14:40:15"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 45
                      last_page:
                        type: integer
                        example: 3
        '404':
          $ref: '#/components/responses/ManageUserNotFound'
        '422':
          $ref: '#/components/responses/ManageValidationError'

  /api/chat/bot/manage/rooms:
    get:
      operationId: listChatBotManageRooms
      tags: [Manage]
      summary: Tìm kiếm và lọc phòng toàn hệ thống
      description: |
        Tìm kiếm và lọc phòng chat trên toàn hệ thống. Hỗ trợ tìm kiếm theo tiêu đề phòng hoặc theo user (khi truyền ID user vào tham số `q` hoặc `user_id`).
        
        API này không yêu cầu Bearer token.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: "Tìm theo tiêu đề; nếu truyền ID dạng user_123 hoặc guest_456 thì lọc theo user"
          example: "Tư vấn tuyển sinh"
        - name: user_id
          in: query
          required: false
          schema:
            type: string
          description: "Lọc chính xác theo user, dạng user_123 hoặc guest_456"
          example: "user_123"
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: "Trạng thái phòng (1: hoạt động, 0: lưu trữ)"
          example: 1
        - name: created_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Lọc phòng tạo từ thời điểm này"
          example: "2026-10-01 00:00:00"
        - name: created_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Lọc phòng tạo đến thời điểm này"
          example: "2026-10-18 23:59:59"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: "Số trang, mặc định 1"
          example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
          description: "Số kết quả mỗi trang (mặc định 20, tối đa 100)"
          example: 20
      responses:
        '200':
          description: Danh sách phòng chat toàn hệ thống
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1001
                        id_chat_users:
                          type: integer
                          example: 456
                        user_id:
                          type: string
                          example: "user_123"
                        title:
                          type: string
                          example: "Tư vấn tuyển sinh CNTT"
                        status:
                          type: integer
                          example: 1
                        model:
                          type: string
                          example: "gpt-4o-mini"
                        agent:
                          type: string
                          nullable: true
                          example: null
                        message_count:
                          type: integer
                          example: 25
                        active_message_count:
                          type: integer
                          example: 24
                        hidden_message_count:
                          type: integer
                          example: 1
                        last_message_at:
                          type: string
                          nullable: true
                          example: "2026-10-18 10:20:30"
                        created_at:
                          type: string
                          example: "2026-10-12 08:00:00"
                        updated_at:
                          type: string
                          example: "2026-10-18 10:20:30"
                  meta:
                    type: object
                    required: [current_page, per_page, total, last_page]
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 120
                      last_page:
                        type: integer
                        example: 6
        '422':
          $ref: '#/components/responses/ManageValidationError'

  /api/chat/bot/manage/rooms/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: integer
        description: "ID phòng chat"
        example: 1001
    get:
      operationId: getChatBotManageRoomDetail
      tags: [Manage]
      summary: Xem chi tiết phòng
      description: |
        Xem chi tiết phòng, gồm thông tin phòng và số lượng tin nhắn theo trạng thái.
        
        API này không yêu cầu Bearer token.
      responses:
        '200':
          description: Chi tiết phòng chat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1001
                      id_chat_users:
                        type: integer
                        example: 456
                      user_id:
                        type: string
                        example: "user_123"
                      title:
