                  data:
                    type: object
                    required:
                      - id
                      - workspace_name
                      - work_space_code
                      - parent_workspace_code
                      - path
                      - content
                    properties:
                      id:
                        type: integer
                        example: 2
                      workspace_name:
                        type: string
                        example: Hust Workspace Test
                      work_space_code:
                        type: string
                        example: workspace_hust_test
                      parent_workspace_code:
                        type: string
                        example: workspace-chat_bot
                      path:
                        type: string
                        example: workspace-chat_bot/workspace_hust_test/SKILL.md
                      content:
                        type: string
                        description: Nội dung định dạng Markdown của file.
                        example: "# Nội dung Markdown..."
              example:
                data:
                  id: 2
                  workspace_name: "Hust Workspace Test"
                  work_space_code: "workspace_hust_test"
                  parent_workspace_code: "workspace-chat_bot"
                  path: "workspace-chat_bot/workspace_hust_test/SKILL.md"
                  content: "# Nội dung Markdown..."
        '404':
          description: Không tìm thấy workspace theo ID hoặc file Markdown theo đường dẫn.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Không tìm thấy file Markdown hoặc workspace."
        '422':
          description: Thiếu hoặc sai id, đường dẫn path không hợp lệ hoặc không trỏ tới file .md.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Đường dẫn path không hợp lệ hoặc thiếu id."
        '503':
          description: Không thể đọc file từ hệ thống lưu trữ.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Không thể đọc nội dung file Markdown."

