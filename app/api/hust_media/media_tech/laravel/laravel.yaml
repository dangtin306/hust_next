      summary: Khóa hoặc mở người dùng
      description: |
        Cập nhật trạng thái khóa/mở người dùng.
        - `status = 0`: khóa tất cả session thuộc user.
        - `status = 1`: mở tất cả session thuộc user.
        Với `guest_456`, thao tác chỉ ảnh hưởng session guest đó. API này không yêu cầu Bearer token.
      parameters:
        - name: userId
          in: path
          required: true
          description: Định dạng user_123 hoặc guest_456.
          schema:
            type: string
            pattern: '^(user|guest)_[1-9][0-9]*$'
            example: user_123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: integer
                  enum: [0, 1]
                  description: "0: khóa user/session, 1: mở lại user/session"
                  example: 0
      responses:
        '200':
          description: Cập nhật trạng thái người dùng thành công.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [user_id, status, session_count, changed_session_count]
                    properties:
                      user_id:
                        type: string
                        example: user_123
                      status:
                        type: string
                        enum: [active, disabled]
                        example: disabled
                      session_count:
                        type: integer
                        example: 2
                      changed_session_count:
                        type: integer
                        example: 2
        '404':
          $ref: '#/components/responses/ManageUserNotFound'
        '422':
          $ref: '#/components/responses/ManageValidationError'
        '429':
          $ref: '#/components/responses/ManageRateLimited'
        '503':
          $ref: '#/components/responses/ManageNotConfigured'

  /api/chat/bot/manage/users/{userId}/rooms:
    get:
      operationId: listChatBotManageUserRooms
      tags: [Manage]
      summary: Xem phòng chat của người dùng
      description: |
        Lấy danh sách metadata phòng chat của người dùng theo `userId`.
        Danh sách được sắp xếp theo thời gian cập nhật gần nhất. Không trả nội dung tin nhắn. API này không yêu cầu Bearer token.
      parameters:
        - name: userId
          in: path
          required: true
          description: Định dạng user_123 hoặc guest_456.
          schema:
            type: string
            pattern: '^(user|guest)_[1-9][0-9]*$'
            example: user_123
        - name: per_page
          in: query
          required: false
          description: Số phòng mỗi trang; từ 1 đến 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: page
          in: query
          required: false
          description: Số trang cần lấy.
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
      responses:
        '200':
          description: Lấy danh sách phòng chat thành công.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, id_chat_users, title, status, model, created_at, updated_at]
                      properties:
                        id:
                          type: integer
                          example: 789
                        id_chat_users:
                          type: integer
                          example: 456
                        title:
                          type: string
                          example: Trao đổi về API
                        status:
                          type: integer
                          example: 1
                        model:
                          type: string
                          example: model-name
                        agent:
                          type: string
                          nullable: true
                          example: null
                        created_at:
                          type: string
                          example: "2026-10-12 08:00:00"
                        updated_at:
                          type: string
                          example: "2026-10-18 10:20:30"
                  meta:
                    type: object
                    required: [current_page, per_page, total, last_page]
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
        '404':
          $ref: '#/components/responses/ManageUserNotFound'
        '422':
          $ref: '#/components/responses/ManageValidationError'
        '429':
          $ref: '#/components/responses/ManageRateLimited'
        '503':
          $ref: '#/components/responses/ManageNotConfigured'

  /api/demo/hello:
