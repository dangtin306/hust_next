        - name: path
          in: query
          required: true
          description: Đường dẫn đầy đủ tương đối từ workspace root (lấy từ full_path của API cây thư mục).
          schema:
            type: string
            example: workspace-chat_bot/workspace_hust_test/SKILL.md
      responses:
        '200':
          description: Nội dung file Markdown thành công.
          content:
            application/json:
              schema:
                type: object
                required: [data]
