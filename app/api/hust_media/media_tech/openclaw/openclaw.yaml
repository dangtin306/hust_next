                        slug:
                          type: string
                          example: workspace-test
                        description:
                          type: string
                          example: '...'
                        status:
                          type: string
                          example: active
                        created_at:
                          type: string
                          example: '...'
                        updated_at:
                          type: string
                          example: '...'
                        children:
                          type: array
                          description: Các skill workspace do OpenClaw nhận diện cho từng agent.
                          items:
                            type: object
                            required:
                            - agent_code
                            - work_space_code
                            properties:
                              agent_code:
                                type: string
                                description: Mã agent OpenClaw sở hữu skill.
                                example: test
                              work_space_code:
                                type: string
                                description: Tên skill chính xác do OpenClaw dùng để nhận diện/gọi.
                                example: workspace_backend_support
                              path:
                                type: string
                                example: skills/workspace_backend_support
                              description:
                                type: string
                                example: Mô tả skill do OpenClaw trả về
                              source:
                                type: string
                                example: openclaw-workspace
                              bundled:
                                type: boolean
                                example: false
                              filePath:
                                type: string
                                description: Đường dẫn tuyệt đối tới SKILL.md.
                                example: D:\\hustmedia\\workspace\\skills\\workspace_backend_support\\SKILL.md
                              baseDir:
                                type: string
                                description: Đường dẫn tuyệt đối tới thư mục skill.
                                example: D:\\hustmedia\\workspace\\skills\\workspace_backend_support
                              skillKey:
                                type: string
                                example: workspace_backend_support
                              always:
                                type: boolean
                                example: false
                              disabled:
                                type: boolean
                                example: false
                              blockedByAllowlist:
                                type: boolean
                                example: false
                              blockedByAgentFilter:
                                type: boolean
                                example: false
                              eligible:
