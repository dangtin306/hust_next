        in: query
        required: true
        description: Đường dẫn đầy đủ tương đối từ workspace root (lấy từ full_path của API cây thư mục).
        schema:
          type: string
          example: workspace-chat_bot/workspace_hust_test/SKILL.md
      requestBody:
        required: true
        description: JSON body chứa nội dung Markdown mới cần ghi vào file.
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              properties:
                content:
                  type: string
                  description: Nội dung Markdown mới cần ghi đè vào file. Gửi chuỗi rỗng để làm trống file.
                  example: '# Nội dung Markdown mới

                    ...'
            examples:
              updateContent:
                summary: Ghi nội dung Markdown mới
                value:
                  content: '# Nội dung Markdown mới


                    Cập nhật tài liệu API.'
              clearContent:
                summary: Làm trống file Markdown
                value:
                  content: ''
      responses:
        '200':
          description: Cập nhật nội dung file Markdown thành công.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Markdown file updated.
                  data:
                    type: object
                    required:
                    - id
                    - workspace_name
                    - work_space_code
                    - parent_workspace_code
                    - path
                    - bytes_written
                    properties:
                      id:
                        type: integer
                        example: 2
                      workspace_name:
                        type: string
                        example: Hust Workspace Test
                      work_space_code:
                        type: string
                        example: workspace_hust_test
                      parent_workspace_code:
                        type: string
                        example: workspace-chat_bot
                      path:
                        type: string
                        example: workspace-chat_bot/workspace_hust_test/SKILL.md
                      bytes_written:
                        type: integer
                        description: Số bytes đã ghi vào file.
                        example: 6483
              example:
                success: true
                message: Markdown file updated.
                data:
                  id: 2
                  workspace_name: Hust Workspace Test
                  work_space_code: workspace_hust_test
                  parent_workspace_code: workspace-chat_bot
                  path: workspace-chat_bot/workspace_hust_test/SKILL.md
                  bytes_written: 6483
        '404':
          description: Không tìm thấy file Markdown hoặc workspace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: File không tồn tại.
        '422':
          description: Thiếu/sai id, đường dẫn path không hợp lệ hoặc không trỏ tới file .md.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Đường dẫn sai hoặc workspace không hợp lệ.
        '503':
          description: Thư mục hoặc file không truy cập được / lỗi ghi file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Thư mục hoặc file không truy cập được.
  /qwen/v1/models:
    get:
      operationId: qwenRelayListModels
      tags:
      - Qwen Relay
      summary: Danh sách model Qwen
      description: Trả danh sách model cố định của relay (qwen_v1). Không đánh thức model. Cần khóa Bearer.
      servers: &id002
      - url: http://118.70.169.219:8818
        description: Node Media Tech công khai (Qwen relay, có khóa)
      security:
      - &id003
        QwenBearer: []
      responses:
        '200':
          description: Danh sách model
          content:
            application/json:
              schema:
                type: object
              example:
                object: list
                data:
                - id: qwen_v1
                  object: model
                  created: 0
                  owned_by: local
        '401':
          description: Thiếu hoặc sai khóa
          content:
            application/json:
              schema: &id001
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      type:
                        type: string
              example:
                error:
                  message: 'Thiếu hoặc sai khóa truy cập (Authorization: Bearer ...).'
                  type: authentication_error
        '503':
          description: Relay chưa được cấu hình khóa
          content:
            application/json:
              schema: *id001
              example:
                error:
                  message: Qwen relay chưa được cấu hình khóa truy cập.
                  type: server_error
  /qwen/v1/chat/completions:
    post:
      operationId: qwenRelayChatCompletions
      tags:
      - Qwen Relay
      summary: Chat với Qwen (OpenAI-compatible)
      description: Gửi hội thoại tới Qwen, trả theo định dạng chat.completion. Hỗ trợ stream=true (SSE). Cần khóa Bearer. Với PowerShell hoặc Git Bash trên Windows, nên ghi body ra file UTF-8 rồi dùng --data-binary
        @file để tránh lỗi tiếng Việt.
      servers: *id002
      security:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - messages
              properties:
                model:
                  type: string
                  example: qwen_v1
                  description: Hiện chỉ có qwen_v1.
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                        - system
                        - user
                        - assistant
                      content:
                        type: string
                max_tokens:
                  type: integer
                  example: 256
                temperature:
                  type: number
                  example: 0.7
                stream:
                  type: boolean
                  example: false
            example:
              model: qwen_v1
              messages:
              - role: user
                content: Xin chào
              max_tokens: 256
              stream: false
      responses:
        '200':
          description: Phản hồi chat (hoặc SSE nếu stream=true)
          content:
            application/json:
              schema:
                type: object
              example:
                id: chatcmpl-...
                object: chat.completion
                model: qwen_v1
                choices:
                - index: 0
                  message:
                    role: assistant
                    content: Chào bạn!
                  finish_reason: stop
        '400':
          description: Body sai định dạng
          content:
            application/json:
              schema: *id001
              example:
                error:
                  message: JSON body không hợp lệ.
                  type: invalid_request_error
        '401':
          description: Thiếu hoặc sai khóa
          content:
            application/json:
              schema: *id001
              example:
                error:
                  message: 'Thiếu hoặc sai khóa truy cập (Authorization: Bearer ...).'
                  type: authentication_error
        '502':
          description: Không kết nối được Qwen
          content:
            application/json:
              schema: *id001
              example:
                error:
                  message: 'Không kết nối được Qwen: ECONNREFUSED'
                  type: server_error
        '503':
          description: Relay chưa được cấu hình khóa
          content:
            application/json:
              schema: *id001
              example:
                error:
                  message: Qwen relay chưa được cấu hình khóa truy cập.
                  type: server_error
components:
  parameters:
    AgentPath:
      name: agent
      in: path
      required: true
      description: Mã agent OpenClaw hoặc tên viết tắt.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,64}$
        example: chat_bot
  responses:
    ToolOk:
      description: 'Phản hồi JSON-RPC dạng SSE: một sự kiện `event: message` kèm `data: {...}`; kết quả công cụ ở `result.content`.'
      content:
        text/event-stream:
          schema:
            type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Token điều phối (`ORCH_API_TOKEN` phía server). Chỉ cần khi thực thi thật; để trống thì mọi lần chạy là dry-run.

        '
    QwenBearer:
      type: http
      scheme: bearer
      description: 'Khóa truy cập Qwen relay do quản trị viên cấp (Authorization: Bearer <khóa>).'
  schemas:
    JsonRpcRequest:
      type: object
      required:
      - jsonrpc
      - method
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
          enum:
          - initialize
          - tools/list
          - tools/call
        params:
          type: object
    Error:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
    Status:
      type: object
      properties:
        ok:
          type: boolean
        config:
          type: object
          properties:
            enabled:
              type: boolean
            dry_run:
              type: boolean
            live_approved:
              type: boolean
            live_possible:
              type: boolean
              description: '`true` chỉ khi mọi khóa thực thi thật đều mở.'
            decider:
              type: string
              enum:
              - laya
              - jev
            openclaw_configured:
              type: boolean
            api_token_set:
              type: boolean
            limits:
              type: object
              properties:
                maxIterations:
                  type: integer
                timeBudgetMs:
                  type: integer
                maxAiCalls:
                  type: integer
        services:
          type: object
          properties:
            math:
              $ref: '#/components/schemas/ServiceHealth'
            laya:
              $ref: '#/components/schemas/ServiceHealth'
    ServiceHealth:
      type: object
      properties:
        reachable:
          type: boolean
        ok:
          type: boolean
    AgentRegistry:
      type: object
      properties:
        ok:
          type: boolean
        openclaw:
          type: object
          properties:
            reachable:
              type: boolean
            ok:
              type: boolean
            connected:
              type: boolean
            subscribed:
              type: boolean
            plugins:
              type: integer
              nullable: true
            error:
              type: string
        agents:
          type: array
          items:
            type: object
            properties:
              agent_code:
                type: string
              workspaces:
                type: array
                items:
                  type: string
              mcp_path:
                type: string
                description: Đường dẫn endpoint MCP riêng của agent này.
        workspaces:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
                nullable: true
              status:
                type: string
                nullable: true
              parent:
                type: string
                nullable: true
        error:
          type: string
        fetched_at:
          type: string
          format: date-time
        cached:
          type: boolean
    RunRequest:
      type: object
      required:
      - scenario
      properties:
        scenario:
          type: string
          enum:
          - agent_failure
          - queue_growth
        samples:
          type: array
          description: Dùng cho `agent_failure`.
          items:
            type: object
            required:
            - agent_id
            - outcome
            properties:
              agent_id:
                type: string
                maxLength: 128
              outcome:
                type: string
                description: '`success` hoặc một giá trị lỗi như `error`, `timeout`.'
                maxLength: 64
        depths:
          type: array
          description: Dùng cho `queue_growth`. Số hữu hạn.
          items:
            type: number
        series:
          type: array
          description: Thay cho `samples` hoặc `depths`. Mỗi phần tử là dữ liệu quan sát của một vòng (tối đa 50 vòng).
          items:
            type: array
            items: {}
        task_id:
          type: string
          maxLength: 128
        agent_id:
          type: string
          maxLength: 128
        workspace_id:
          type: string
          maxLength: 128
    RunResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - resolved
          - escalated
          - insufficient_data
          - max_iterations
          - time_budget_exhausted
          - math_unavailable
          - disabled
        run_id:
          type: string
        scenario:
          type: string
        iterations:
          type: integer
        ai_calls:
          type: integer
        actions:
          type: array
          items:
            type: object
            properties:
              iteration:
                type: integer
              option_id:
                type: string
              action:
                type: string
                enum:
                - notify
                - pause_agent
                - throttle_intake
              target:
                type: string
                nullable: true
              source:
                type: string
                description: '`laya` khi Laya chọn, `fallback` khi dùng phương án an toàn `notify_only`.'
              status:
                type: string
                description: '`dry_run`, `blocked`, `notified`, `sent` hoặc `failed`.'
        dry_run:
          type: boolean
        live:
          type: boolean
    ManageError:
      type: object
      required:
      - success
      - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: CHAT_BOT_MANAGE_UNAUTHORIZED
            message:
              type: string
              example: A valid bearer token is required.
    WorkspaceRoutingUpdateResult:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
    ManageValidationError:
      type: object
      required:
      - message
      - errors
      properties:
        message:
          type: string
          example: The status field is required.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            status:
            - The status field is required.
