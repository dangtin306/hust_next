openapi: 3.0.3
info:
  title: Hust Multi Agent API
  version: 0.1.0
  description: 'API điều phối Multi Agent chạy trong Node.js main server của Hust.


    Vòng xử lý: Node.js nhận dữ liệu quan sát, gọi dịch vụ Python toán học (đạo hàm sai phân, xác suất thống kê),

    đưa kết quả và danh sách phương án hợp lệ cho Laya (engine lựa chọn chạy local), rồi chuyển phương án đã chọn cho executor.


    **Mặc định mọi lần chạy là dry-run**: chỉ ghi nhận quyết định, không gửi lệnh nào tới OpenClaw. Thực thi thật bị khóa

    và cần đồng thời cấu hình phía server cùng header `Authorization: Bearer <token>` hợp lệ.


    Route `GET /multi/agents/agents` chỉ đọc: liệt kê agent OpenClaw và workspace con của từng agent. Upstream mất khoảng 20 giây

    ở lần đầu, sau đó được cache 60 giây.

    '
servers:
- url: https://node_js.hust.media
  description: Node.js main server (production)
- url: http://localhost:2999
  description: Node.js main server local (cổng 2999)
tags:
- name: Status
  description: Trạng thái bộ điều phối, dịch vụ toán học và Laya.
- name: Agents
  description: Danh sách agent OpenClaw và workspace con (chỉ đọc).
- name: Run
  description: Chạy một vòng điều phối cho tình huống Agent thất bại hoặc hàng đợi tăng bất thường.
- name: MCP
  description: Endpoint MCP riêng cho từng agent, để Codex hoặc AI khác gọi công cụ.
- name: Tools
  description: Các công cụ MCP của agent, tổng 55 công cụ gồm 8 công cụ đọc workspace, 6 công cụ `ui_*` (gõ phím, đổi Việt/Anh của VKey) và 41 công cụ `agent_desktop_*` (điều khiển desktop); có hướng dẫn
    gọi nhóm desktop và chụp màn hình.
- name: Workspace API (Laravel)
  description: Workspace REST and Markdown APIs. Laravel still handles these requests; they are grouped here for API discovery.
- name: Qwen Relay
  description: Gọi Qwen (Huihui 27B) qua Node Media Tech tại http://118.70.169.219:8818. Cần khóa Bearer do quản trị viên cấp (đặt ở nút Authorize). Khóa không được ghi trong tài liệu này. Không có khóa
    hoặc sai khóa trả 401. Lần gọi đầu sau khi model ngủ có thể chậm khoảng 8 giây do nạp model từ đĩa.
paths:
  /multi/agents/status:
    get:
      tags:
      - Status
      operationId: getMultiAgentsStatus
      summary: Trạng thái bộ điều phối
      description: 'Cho biết chế độ dry-run, engine chọn phương án đang dùng và dịch vụ toán học, Laya có sẵn sàng hay không.

        `ok` là `true` khi toán học và Laya đều sẵn sàng. Token và user id OpenClaw không bao giờ được trả về.

        '
      security: []
      responses:
        '200':
          description: Trạng thái hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                ok: true
                config:
                  enabled: true
                  dry_run: true
                  live_approved: false
                  live_possible: false
                  decider: laya
                  openclaw_configured: false
                  api_token_set: false
                  limits:
                    maxIterations: 3
                    timeBudgetMs: 10000
                    maxAiCalls: 5
                services:
                  math:
                    reachable: true
                    ok: true
                  laya:
                    reachable: true
                    ok: true
  /multi/agents/agents:
    get:
      tags:
      - Agents
      operationId: listMultiAgents
      summary: Danh sách agent và workspace
      description: 'Đọc `/openclaw/v2/health` và endpoint tổng hợp tương thích `/openclaw/v2/list` để gom workspace con theo từng agent. API workspace chuẩn `/openclaw/v2/workspace/list` nhận `agent_code`
        và chỉ trả workspace của agent đó.

        Danh sách được cache kiểu stale-while-revalidate: đã nạp một lần thì mọi lần sau trả ngay (quá 60 giây trả bản cũ kèm `stale: true` và làm mới ngầm). Các lần làm mới đồng thời dùng chung một request
        tới OpenClaw.

        Gateway không với tới được thì trả `502`.

        '
      security: []
      parameters:
      - name: refresh
        in: query
        required: false
        description: Đặt `1` để bỏ qua cache.
        schema:
          type: string
          enum:
          - '1'
      responses:
        '200':
          description: Registry agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegistry'
              example:
                ok: true
                openclaw:
                  reachable: true
                  ok: true
                  connected: true
                  subscribed: true
                  plugins: 15
                agents:
                - agent_code: chat_bot
                  workspaces:
                  - workspace_hust_dev
                  - workspace_hust_test
                  - workspace_hust_users
                  mcp_path: /multi/agents/chat_bot/mcp
                - agent_code: main
                  workspaces:
                  - workspace_hust_dev
                  - workspace_hust_test
                  - workspace_hust_users
                  mcp_path: /multi/agents/main/mcp
                workspaces:
                - code: workspace-chat_bot
                  name: Workspace Chat Bot
                  status: active
                  parent: openclaw
                fetched_at: '2026-10-29T10:00:00.000Z'
                cached: false
        '502':
          description: Không gọi được OpenClaw gateway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegistry'
  /multi/agents/run:
    post:
      tags:
      - Run
      operationId: runMultiAgents
      summary: Chạy một vòng điều phối
      description: 'Chạy vòng observe → analyze → decide → act cho một tình huống.


        - `agent_failure`: gửi `samples` (mỗi mẫu có `agent_id` và `outcome`).

        - `queue_growth`: gửi `depths` (độ sâu hàng đợi theo thời gian, mỗi mẫu cách nhau 1 giây).

        - Có thể gửi `series` thay cho `samples` hoặc `depths`: mỗi phần tử là dữ liệu quan sát của một vòng, dùng để thử kịch bản hồi phục.


        Tối đa 2 lần chạy cùng lúc, lần vượt giới hạn nhận `429`. Không có token hợp lệ thì luôn là dry-run.

        Kết quả `status`: `resolved`, `escalated`, `insufficient_data`, `max_iterations`, `time_budget_exhausted`, `math_unavailable` hoặc `disabled`.

        '
      security:
      - {}
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
            examples:
              queue_growth:
                summary: Hàng đợi tăng bất thường
                value:
                  scenario: queue_growth
                  depths:
                  - 10
                  - 14
                  - 18
                  - 22
                  - 26
                  - 30
                  - 34
                  - 38
                  - 42
                  - 46
                  task_id: task-001
                  workspace_id: workspace-chat_bot
              queue_growth_recovery:
                summary: Hàng đợi tăng rồi ổn định (series)
                value:
                  scenario: queue_growth
                  series:
                  - - 10
                    - 14
                    - 18
                    - 22
                    - 26
                    - 30
                    - 34
                    - 38
                    - 42
                    - 46
                  - - 30
                    - 30
                    - 30
                    - 30
                    - 30
                    - 30
                    - 30
                    - 30
                    - 30
                    - 30
                  task_id: task-002
              agent_failure:
                summary: Agent thất bại liên tiếp
                value:
                  scenario: agent_failure
                  samples:
                  - agent_id: media_tech
                    outcome: error
                  - agent_id: media_tech
                    outcome: error
                  - agent_id: media_tech
                    outcome: error
                  - agent_id: media_tech
                    outcome: error
                  - agent_id: media_tech
                    outcome: error
                  - agent_id: media_tech
                    outcome: error
                  - agent_id: chat_bot
                    outcome: success
                  - agent_id: chat_bot
                    outcome: success
                  task_id: task-003
                  agent_id: media_tech
                  workspace_id: workspace-chat_bot
      responses:
        '200':
          description: Kết quả vòng điều phối.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
              example:
                status: resolved
                run_id: 17142db1-7156-4614-95ea-f38a6b1ce403
                scenario: agent_failure
                iterations: 2
                ai_calls: 1
                actions:
                - iteration: 1
                  option_id: pause_agent:media_tech
                  action: pause_agent
                  target: media_tech
                  source: laya
                  status: dry_run
                dry_run: true
                live: false
        '400':
          description: Dữ liệu gửi lên không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                error: scenario must be agent_failure or queue_growth
        '413':
          description: Body vượt quá giới hạn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Đang có quá nhiều lần chạy cùng lúc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Bộ điều phối đang tắt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /multi/agents/{agent}/mcp:
    post:
      tags:
      - MCP
      operationId: agentMcp
      summary: MCP endpoint riêng của một agent
      description: 'Mỗi agent OpenClaw có một MCP server riêng (Streamable HTTP, không giữ trạng thái) để Codex hoặc AI khác kết nối thẳng tới đúng agent.

        Gửi JSON-RPC 2.0 bằng `POST`: `initialize`, `tools/list`, `tools/call`.


        Gửi `Content-Type: application/json`. Header `Accept` nên là `application/json, text/event-stream`, nhưng không bắt buộc:

        client chỉ gửi `application/json`, `*/*` hoặc không gửi gì vẫn được phục vụ. Phản hồi luôn là một sự kiện SSE `event: message` chứa JSON-RPC.


        **Mở cho mọi nguồn (CORS `*`)**: trình duyệt ở bất kỳ trang nào cũng gọi được. Preflight `OPTIONS` được phản hồi đúng các header trình duyệt xin

        (kể cả `Authorization`, `Mcp-Session-Id`, `MCP-Protocol-Version`).


        `GET` thường (ví dụ mở bằng trình duyệt) trả mô tả endpoint và danh sách công cụ. `GET` xin luồng SSE (`Accept: text/event-stream`) và `DELETE`

        nhận `405` kèm `Allow` vì server không giữ trạng thái. Có giới hạn số request MCP xử lý cùng lúc; vượt giới hạn nhận `429` kèm `Retry-After`.


        `{agent}` là mã agent của OpenClaw (`chat_bot`, `main`, `media_tech`, `test`...). Có thể đặt tên viết tắt như `agent-01` bằng biến

        `ORCH_AGENT_ALIASES` phía server. Agent không tồn tại trả `404` kèm danh sách agent hợp lệ (sau khi registry đã nạp).


        Công cụ:

        - `agent_info`: workspace cha, các workspace con (lấy từ SQL), workspace dùng chung và trạng thái gateway của agent (chỉ đọc).

        - `get_workspace_tree`: bước đầu tiên. Liệt kê workspace phân cấp: nhóm mẹ, các workspace con, workspace dùng chung, kèm `description` và `markdown_count` (chỉ đọc).

        - `get_workspace_info`: thông tin một workspace (mô tả, workspace con, thư mục cấp một).

        - `search_workspace`: Laya xếp hạng workspace phù hợp với câu hỏi; `routing.source` là `laya` hoặc `keyword_only`.

        - `get_markdown_tree`: cây thư mục và file `.md` đệ quy theo thực tế trên đĩa (số tầng không cố định), nhóm mẹ trả tổng quan cả nhóm; `path` lấy cây con, `max_depth` giới hạn tầng (chỉ đọc).

        - `get_markdown_full`: như `get_markdown_tree` nhưng kèm nội dung từng file `.md` trong giới hạn dung lượng, che giá trị giống khóa bí mật (chỉ đọc).

        - `get_markdown_file`: đọc một file `.md` theo (`workspace`, `path` tương đối). Chỉ `.md`, không thoát khỏi thư mục workspace, bỏ bộ nhớ riêng của agent, tối đa 256 KB mỗi file (chỉ đọc).

        - `search_markdown`: tìm file `.md` phù hợp với câu hỏi hoặc từ khóa (đủ mọi từ trước, không có thì khớp bất kỳ từ nào); Laya xếp lại ứng viên, mỗi kết quả có `probability` và `relevance`. Bỏ trống
        `workspace` để tìm khắp nơi (chỉ đọc).

        - `ui_list_windows`, `ui_type_text`, `ui_press_key`: gõ phím vào cửa sổ máy chủ theo `window_handle` (nhóm cũ, không chỉ đọc).

        - `ui_get_language`, `ui_set_language`, `ui_toggle_language`: đọc và đổi chế độ Việt/Anh của VKey (nhóm cũ, chỉ dùng cho việc đó).

        - `agent_desktop_*` (41 công cụ): nhìn màn hình và điều khiển máy chủ như người (chụp ảnh, chuột, phím, clipboard, cửa sổ, accessibility). Chụp màn hình dùng `agent_desktop_screenshot`.


        Hiện endpoint chưa giới hạn truy cập. Nhóm đọc workspace chỉ đọc; nhóm `ui_*` và `agent_desktop_*` điều khiển được máy chủ nên ai biết URL đều dùng được. Không có công cụ nào gửi tin nhắn tới agent.

        '
      security:
      - {}
      - BearerAuth: []
      parameters:
      - name: agent
        in: path
        required: true
        description: Mã agent OpenClaw hoặc tên viết tắt.
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          example: chat_bot
      - name: Accept
        in: header
        required: false
        description: Nên là `application/json, text/event-stream`. Không bắt buộc, giá trị khác vẫn được phục vụ.
        schema:
          type: string
          default: application/json, text/event-stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              tools_list:
                summary: Danh sách công cụ của agent
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: tools/list
                  params: {}
              agent_info:
                summary: Gọi công cụ agent_info
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/call
                  params:
                    name: agent_info
                    arguments: {}
              search_markdown:
                summary: Tìm file .md theo câu hỏi (Laya xếp lại)
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/call
                  params:
                    name: search_markdown
                    arguments:
                      query: Cổng của Go API là bao nhiêu?
                      workspace: workspace_hust_dev
      responses:
        '200':
          description: 'Phản hồi JSON-RPC dạng SSE: một sự kiện `event: message` kèm `data: {...}`.'
          content:
            text/event-stream:
              schema:
                type: string
              example: 'event: message

                data: {"result":{"tools":[{"name":"agent_info"},{"name":"get_workspace_tree"},{"name":"search_markdown"}]},"jsonrpc":"2.0","id":1}

                '
        '404':
          description: Agent không tồn tại.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                    example: agent_not_found
                  agent:
                    type: string
                  agents:
                    type: array
                    items:
                      type: string
        '405':
          description: '`GET` xin luồng SSE hoặc `DELETE`: server không giữ trạng thái. Header `Allow: POST, GET, OPTIONS`.'
        '413':
          description: Body vượt quá giới hạn.
        '429':
          description: Đang có quá nhiều request MCP cùng lúc. Thử lại sau theo `Retry-After`.
        '503':
          description: Bộ điều phối đang tắt.
  /multi/agents/{agent}/mcp#agent_info:
    post:
      tags:
      - Tools
      operationId: tool_agent_info
      summary: 'agent_info: Thông tin agent'
      description: 'Workspace cha, workspace con (từ SQL), workspace dùng chung và trạng thái gateway của agent.


        Gọi qua `POST /multi/agents/{agent}/mcp` bằng JSON-RPC `tools/call` (xem mẫu bên dưới). Công cụ chỉ đọc.

        '
      parameters:
      - $ref: '#/components/parameters/AgentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            example:
              jsonrpc: '2.0'
              id: 10
              method: tools/call
              params:
                name: agent_info
                arguments: {}
      responses:
        '200':
          $ref: '#/components/responses/ToolOk'
  /multi/agents/{agent}/mcp#get_workspace_tree:
    post:
      tags:
      - Tools
      operationId: tool_get_workspace_tree
      summary: 'get_workspace_tree: Cây workspace'
      description: 'Bước đầu tiên: liệt kê workspace phân cấp (nhóm mẹ, workspace con, dùng chung) kèm mô tả và số file .md.


        Gọi qua `POST /multi/agents/{agent}/mcp` bằng JSON-RPC `tools/call` (xem mẫu bên dưới). Công cụ chỉ đọc.

        '
      parameters:
      - $ref: '#/components/parameters/AgentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            example:
              jsonrpc: '2.0'
              id: 11
              method: tools/call
              params:
                name: get_workspace_tree
                arguments: {}
      responses:
        '200':
          $ref: '#/components/responses/ToolOk'
  /multi/agents/{agent}/mcp#get_workspace_info:
    post:
      tags:
      - Tools
      operationId: tool_get_workspace_info
      summary: 'get_workspace_info: Thông tin một workspace'
      description: 'Mô tả, workspace con, thư mục và file cấp một của một workspace.


        Gọi qua `POST /multi/agents/{agent}/mcp` bằng JSON-RPC `tools/call` (xem mẫu bên dưới). Công cụ chỉ đọc.

        '
      parameters:
      - $ref: '#/components/parameters/AgentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            example:
              jsonrpc: '2.0'
              id: 12
              method: tools/call
              params:
                name: get_workspace_info
                arguments:
                  workspace: workspace_hust_dev
      responses:
        '200':
          $ref: '#/components/responses/ToolOk'
  /multi/agents/{agent}/mcp#search_workspace:
    post:
      tags:
      - Tools
      operationId: tool_search_workspace
      summary: 'search_workspace: Tìm workspace bằng câu hỏi (Laya)'
      description: 'Laya xếp hạng workspace phù hợp với câu hỏi. `routing.source` là `laya` hoặc `keyword_only`.


        Gọi qua `POST /multi/agents/{agent}/mcp` bằng JSON-RPC `tools/call` (xem mẫu bên dưới). Công cụ chỉ đọc.

        '
      parameters:
      - $ref: '#/components/parameters/AgentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            example:
              jsonrpc: '2.0'
              id: 13
              method: tools/call
              params:
                name: search_workspace
                arguments:
                  question: Cổng của Go API là bao nhiêu?
      responses:
        '200':
          $ref: '#/components/responses/ToolOk'
  /multi/agents/{agent}/mcp#get_markdown_tree:
    post:
      tags:
      - Tools
      operationId: tool_get_markdown_tree
      summary: 'get_markdown_tree: Cây thư mục và file .md'
      description: 'Cây thư mục và file `.md` đệ quy theo thực tế trên đĩa. Tham số `path`, `max_depth` tùy chọn.


        Gọi qua `POST /multi/agents/{agent}/mcp` bằng JSON-RPC `tools/call` (xem mẫu bên dưới). Công cụ chỉ đọc.

        '
      parameters:
      - $ref: '#/components/parameters/AgentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            example:
              jsonrpc: '2.0'
              id: 14
              method: tools/call
              params:
                name: get_markdown_tree
                arguments:
                  workspace: workspace_hust_dev
      responses:
        '200':
          $ref: '#/components/responses/ToolOk'
  /multi/agents/{agent}/mcp#get_markdown_full:
    post:
      tags:
      - Tools
      operationId: tool_get_markdown_full
      summary: 'get_markdown_full: Cây kèm nội dung file .md'
      description: 'Như `get_markdown_tree` nhưng kèm nội dung từng file trong giới hạn dung lượng.


        Gọi qua `POST /multi/agents/{agent}/mcp` bằng JSON-RPC `tools/call` (xem mẫu bên dưới). Công cụ chỉ đọc.

        '
      parameters:
