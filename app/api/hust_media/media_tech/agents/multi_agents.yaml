        workspace cha rồi gọi Node API `GET /openclaw/v2/workspace/list?agent_code=...`,

        sau đó cập nhật các workspace con vào bảng workspace.


        Workspace mẹ không bị sửa; workspace con không bị xóa chỉ vì vắng mặt trong danh

        sách Node. API Laravel không cần query parameters hoặc request body.

        '
      security: []
      responses:
        '200':
          description: Đồng bộ routing workspace thành công.
          content:
            application/json:
