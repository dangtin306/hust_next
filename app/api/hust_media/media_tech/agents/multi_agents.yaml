  /multi/agents/{agent}/mcp#agent_desktop:
    post:
      tags:
      - Tools
      operationId: tool_agent_desktop
      summary: 'agent_desktop_*: Điều khiển desktop như người (41 công cụ)'
      description: 'Nhóm 41 công cụ `agent_desktop_*` dùng để nhìn màn hình và điều khiển máy chủ Windows như người: chụp ảnh, chuột, phím, gõ Unicode, clipboard, cửa sổ, accessibility.

        Mọi công cụ gọi qua cùng endpoint `POST /multi/agents/{agent}/mcp` bằng `tools/call`, tên công cụ là `agent_desktop_<hành động>`.


        **Luồng chạy**: AI bên ngoài → Node.js (cổng 2999) → cầu nối Python `127.0.0.1:8822` → desktop đang đăng nhập.


        **Nhóm công cụ**:

        - Quan sát: `status`, `cursor`, `list_apps`, `list_windows`, `list_displays`, `snapshot`, `screenshot`, `clipboard_get`, `wait`.

        - Theo `ref` (accessibility): `launch`, `click`, `double_click`, `right_click`, `triple_click`, `type`, `set_value`, `focus`, `clear`, `hover`, `scroll`, `expand`, `collapse`, `select`, `toggle`,
        `check`, `uncheck`, `press_ref`.

        - Chuột/phím thật: `press`, `type_text`, `paste`, `clipboard_set`, `mouse_move`, `mouse_click`, `mouse_down`, `mouse_up`, `mouse_wheel`, `drag`.

        - Cửa sổ: `focus_window`, `window_op`.

        - Phiên: `session_start`, `session_end`.


        **Vòng lặp nhanh nhất**: `agent_desktop_screenshot` để nhìn, rồi mỗi thao tác chuột/phím/gõ thêm `screenshot_after: true` để nhận ảnh sau thao tác trong cùng một lượt.

        Có `ref` trong `snapshot` thì thao tác theo `ref`; không có thì `mouse_click` theo tọa độ trong ảnh.


        **Điều kiện**: user đã đăng nhập và desktop đang mở khóa. RDP bị ngắt hoặc màn hình khóa thì chụp và bấm phím báo lỗi (ví dụ `DESKTOP_UNAVAILABLE`, `BitBlt failed`).

        Tắt cả nhóm bằng biến môi trường `ORCH_AGENT_DESKTOP=0` của server Node.js.


        **Bảo mật**: endpoint hiện mở không xác thực, ai biết URL đều xem được màn hình và điều khiển được máy chủ. Không dùng để nhập mật khẩu hay thao tác không thể hoàn tác khi chưa được yêu cầu rõ.

        '
      parameters:
      - $ref: '#/components/parameters/AgentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              status:
                summary: Kiểm tra cầu nối và trạng thái desktop
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: tools/call
                  params:
                    name: agent_desktop_status
                    arguments: {}
              list_windows:
                summary: Liệt kê cửa sổ (lấy hwnd)
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/call
                  params:
                    name: agent_desktop_list_windows
                    arguments: {}
              type_text:
                summary: Gõ chữ rồi nhận luôn ảnh sau thao tác
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/call
                  params:
                    name: agent_desktop_type_text
                    arguments:
                      text: xin chào
                      screenshot_after: true
      responses:
        '200':
          $ref: '#/components/responses/ToolOk'
  /multi/agents/{agent}/mcp#agent_desktop_screenshot:
    post:
      tags:
      - Tools
      operationId: tool_agent_desktop_screenshot
      summary: 'agent_desktop_screenshot: Chụp màn hình máy chủ'
      description: 'Chụp màn hình Windows đang đăng nhập và trả ảnh. Đây là công cụ chụp màn hình hiện dùng (thay cho `screen_capture` đã gỡ). Chỉ đọc.


        **Tham số** (đều tùy chọn):

        - `full_screen`, `screen`: chọn toàn màn hình hoặc một màn hình theo số thứ tự (xem `agent_desktop_list_displays`).

        - `region`: `{x, y, width, height}` theo tọa độ màn hình, chỉ chụp vùng đó để nhìn chi tiết nhỏ.

        - `window`: `hwnd` lấy từ `agent_desktop_list_windows`, chụp vùng của cửa sổ đó.

        - `max_width`: thu nhỏ ảnh; `metadata.scale` cho biết một pixel ảnh bằng bao nhiêu pixel màn hình. Tọa độ màn hình = `region.x/y` + tọa độ ảnh × `metadata.scale`.

        - `format`: `jpeg` (mặc định, nhẹ và nhanh) hoặc `png` (chữ nhỏ cần sắc nét); `quality` từ 30 đến 95.

        - `cursor`: vẽ vòng đỏ và mũi tên tại con trỏ (mặc định `true`) vì ảnh chụp không chứa con trỏ.

        - `grid`: vẽ lưới tọa độ mờ cách nhau N pixel (ví dụ `100`) để đọc tọa độ chính xác; `0` là tắt.

        - `engine`: `gdi` (mặc định, nhanh) hoặc `ffi` (thư viện native, chậm hơn).


        **Kết quả**: `result.content` có phần ảnh (`type: image`, `data` là base64) và phần `text` chứa metadata (kích thước, scale, vị trí con trỏ).

        Với client MCP (Codex, Claude Code...) ảnh được hiển thị trực tiếp; muốn lưu file thì ghi `Buffer.from(data, "base64")`.


        **Điều kiện**: desktop đang đăng nhập và mở khóa. Ảnh chụp lộ mọi thứ trên màn hình nên kiểm tra trước khi chia sẻ.

        Endpoint hiện mở không xác thực nên ai biết URL đều chụp được màn hình máy chủ.

        '
      parameters:
      - $ref: '#/components/parameters/AgentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              default:
                summary: Chụp toàn màn hình (JPEG, có vòng đỏ ở con trỏ)
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: tools/call
                  params:
                    name: agent_desktop_screenshot
                    arguments: {}
              grid:
                summary: Thu nhỏ và vẽ lưới 100 px để đo tọa độ
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/call
                  params:
                    name: agent_desktop_screenshot
                    arguments:
                      max_width: 1280
                      grid: 100
              region:
                summary: Chụp một vùng PNG
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/call
                  params:
                    name: agent_desktop_screenshot
                    arguments:
                      region:
                        x: 0
                        y: 0
                        width: 800
                        height: 600
                      format: png
      responses:
        '200':
          description: 'Phản hồi JSON-RPC dạng SSE. Ảnh nằm ở `result.content[0]` (`type: image`, base64).'
          content:
            text/event-stream:
              schema:
                type: string
              example: 'event: message

                data: {"result":{"content":[{"type":"image","data":"/9j/4AAQSkZJRg...","mimeType":"image/jpeg"},{"type":"text","text":"metadata: kích thước, scale, vị trí con trỏ"}]},"jsonrpc":"2.0","id":1}

                '
        '503':
          description: Bộ điều phối đang tắt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
